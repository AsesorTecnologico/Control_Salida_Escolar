    function getTodayISO() {
      const now = new Date();
      const y = now.getFullYear();
      const m = String(now.getMonth() + 1).padStart(2, '0');
      const d = String(now.getDate()).padStart(2, '0');
      return `${y}-${m}-${d}`;
    }

    function getNextDayISO(isoDate) {
      const base = isoDate ? new Date(`${isoDate}T12:00:00`) : new Date();
      base.setDate(base.getDate() + 1);
      const y = base.getFullYear();
      const m = String(base.getMonth() + 1).padStart(2, '0');
      const d = String(base.getDate()).padStart(2, '0');
      return `${y}-${m}-${d}`;
    }

    // =========================================================================
    // 2. ALARMA SONORA Y VISUAL PERSISTENTE HASTA INDICAR "A PUERTA"
    // =========================================================================
    let audioCtxInstance = null;
    let alarmIntervalId = null;

    function playSingleAlarmTone() {
      try {
        const AudioCtx = window.AudioContext || window.webkitAudioContext;
        if (!AudioCtx) return;
        if (!audioCtxInstance) {
          audioCtxInstance = new AudioCtx();
        }
        if (audioCtxInstance.state === 'suspended') {
          audioCtxInstance.resume();
        }

        const now = audioCtxInstance.currentTime;
        const notes = [
          { freq: 920, start: 0, dur: 0.16 },
          { freq: 1220, start: 0.18, dur: 0.18 }
        ];

        notes.forEach(n => {
          const osc = audioCtxInstance.createOscillator();
          const gain = audioCtxInstance.createGain();
          osc.type = 'sawtooth';
          osc.frequency.setValueAtTime(n.freq, now + n.start);

          gain.gain.setValueAtTime(0.001, now + n.start);
          gain.gain.exponentialRampToValueAtTime(0.22, now + n.start + 0.02);
          gain.gain.exponentialRampToValueAtTime(0.001, now + n.start + n.dur);

          osc.connect(gain);
          gain.connect(audioCtxInstance.destination);

          osc.start(now + n.start);
          osc.stop(now + n.start + n.dur + 0.02);
        });
      } catch (_) {}
    }

          a => a.codigoSede === currentUser.codigoSede &&
               a.alarmaActiva &&
               a.etapaFlujo === FLOW_STEP.NOTIFICADO_AULA &&
               a.asistencia === ASISTENCIA.PRESENTE
        )
      );

      if (shouldRing) {
        playSingleAlarmTone();
        if (!alarmIntervalId) {
          alarmIntervalId = setInterval(() => {
            const stillActive = currentUser &&
              currentUser.perfil === 'TUTOR_AULA' &&
              appState.tbl_alumnos.some(
                a => a.codigoSede === currentUser.codigoSede &&
                     a.alarmaActiva &&
                     a.etapaFlujo === FLOW_STEP.NOTIFICADO_AULA &&
                     a.asistencia === ASISTENCIA.PRESENTE
              );
            if (stillActive) {
              playSingleAlarmTone();
            } else {
              stopContinuousAlarmLoop();
            }
          }, 2600);
        }
      } else {
        stopContinuousAlarmLoop();
      }
    }

    function stopContinuousAlarmLoop() {
      if (alarmIntervalId) {
        clearInterval(alarmIntervalId);
        alarmIntervalId = null;
      }
    }

    // =========================================================================
    // 3. ESTADO DIARIO, AULAS PERMANENTES, HORARIOS POR NIVEL/AULA/SEDE Y MIGRACIÓN
    // =========================================================================
    function buildDefaultHorariosPorNivel() {
      return {
        Inicial: {
          horaIngreso: '08:30',
          horaSalida: '13:30',
          diasActivos: 'Lunes a Viernes'
        },
        Primaria: {
          horaIngreso: '07:45',
          horaSalida: '13:50',
          diasActivos: 'Lunes a Viernes'
        }
      };
    }

    function detectNivelFromGrado(gradoStr = '') {
      const g = String(gradoStr || '').toLowerCase();
      if (g.includes('inicial') || g.includes('años') || g.includes('anos')) {
        return 'Inicial';
      }
      return 'Primaria';
    }

    function getHorarioPorNivel(nivel) {
      if (!appState.horariosPorNivel) {
        appState.horariosPorNivel = buildDefaultHorariosPorNivel();
      }
      const def = buildDefaultHorariosPorNivel();
      const target = nivel === 'Inicial' ? 'Inicial' : 'Primaria';
      if (!appState.horariosPorNivel[target]) {
        appState.horariosPorNivel[target] = { ...def[target] };
      }
      return appState.horariosPorNivel[target];
    }

    function buildDefaultHorarioGlobal() {
      const prim = buildDefaultHorariosPorNivel().Primaria;
      return {
        horaInicioSalida: prim.horaIngreso,
        horaFinSalida: prim.horaSalida,
        diasActivos: prim.diasActivos,
        actualizadoEn: getTodayISO()
      };
    }

    function buildDefaultHorariosPorSede(baseHorario = buildDefaultHorarioGlobal()) {
      const map = {};
      SEDES_Y_GRADOS.forEach(s => {
        const defaultNivel = s.niveles && s.niveles.includes('Inicial') && !s.niveles.includes('Primaria')
          ? 'Inicial'
          : 'Primaria';
        const hNivel = getHorarioPorNivel(defaultNivel);
        map[s.codigoSede] = {
          codigoSede: s.codigoSede,
          nombreSede: s.nombreSede,
          horaInicioSalida: hNivel ? hNivel.horaIngreso : baseHorario.horaInicioSalida,
          horaFinSalida: hNivel ? hNivel.horaSalida : baseHorario.horaFinSalida,
          diasActivos: hNivel ? hNivel.diasActivos : baseHorario.diasActivos,
          actualizadoEn: baseHorario.actualizadoEn || getTodayISO()
        };
      });
      return map;
    }

    function getHorarioDeSede(sedeCode) {
      const hg = appState.horarioGlobal || buildDefaultHorarioGlobal();
      if (!appState.horariosPorSede) {
        appState.horariosPorSede = buildDefaultHorariosPorSede(hg);
      }
      if (!appState.horariosPorSede[sedeCode]) {
        const s = getSedeConfig(sedeCode);
        const hNivel = getHorarioPorNivel('Primaria');
        appState.horariosPorSede[sedeCode] = {
          codigoSede: s.codigoSede,
          nombreSede: s.nombreSede,
          horaInicioSalida: hNivel.horaIngreso,
          horaFinSalida: hNivel.horaSalida,
          diasActivos: hNivel.diasActivos,
          actualizadoEn: getTodayISO()
        };
      }
      return appState.horariosPorSede[sedeCode];
    }

    function getHorarioParaAula(aulaObj, sedeCode) {
      const nivel = aulaObj && aulaObj.nivel
        ? aulaObj.nivel
        : detectNivelFromGrado(aulaObj && aulaObj.grado ? aulaObj.grado : '');
      const hNivel = getHorarioPorNivel(nivel);
      const horaIngreso = (aulaObj && aulaObj.horaIngreso) ? aulaObj.horaIngreso : hNivel.horaIngreso;
      const horaSalida = (aulaObj && aulaObj.horaSalida) ? aulaObj.horaSalida : hNivel.horaSalida;
      const diasActivos = (aulaObj && aulaObj.diasActivos) ? aulaObj.diasActivos : hNivel.diasActivos;
      return { nivel, horaIngreso, horaSalida, diasActivos, codigoSede: sedeCode };
    }

      const defNiv = buildDefaultHorariosPorNivel();
      return [

        { idAula: 'AUL-S01-2', codigoSede: 'S01', nombreAula: 'Aula 104', grado: '4° Grado B', nivel: 'Primaria', horaIngreso: defNiv.Primaria.horaIngreso, horaSalida: defNiv.Primaria.horaSalida, diasActivos: defNiv.Primaria.diasActivos },
        { idAula: 'AUL-S01-3', codigoSede: 'S01', nombreAula: 'Aula I-02', grado: 'Inicial 5 Años', nivel: 'Inicial', horaIngreso: defNiv.Inicial.horaIngreso, horaSalida: defNiv.Inicial.horaSalida, diasActivos: defNiv.Inicial.diasActivos },
        { idAula: 'AUL-S02-1', codigoSede: 'S02', nombreAula: 'Aula 202', grado: '2° Grado A', nivel: 'Primaria', horaIngreso: defNiv.Primaria.horaIngreso, horaSalida: defNiv.Primaria.horaSalida, diasActivos: defNiv.Primaria.diasActivos },
        { idAula: 'AUL-S03-1', codigoSede: 'S03', nombreAula: 'Aula 305', grado: '5° Grado A', nivel: 'Primaria', horaIngreso: defNiv.Primaria.horaIngreso, horaSalida: defNiv.Primaria.horaSalida, diasActivos: defNiv.Primaria.diasActivos }
      ];
    }

    function buildFreshTablesState(preserveAulasAndHorario = null) {
      const today = getTodayISO();
      const accessProfiles = buildAccessProfilesForSedes();
      const tbl_aulas_permanentes = preserveAulasAndHorario && Array.isArray(preserveAulasAndHorario.aulas)

      const horarioGlobal = preserveAulasAndHorario && preserveAulasAndHorario.horario

        ? preserveAulasAndHorario.horariosPorSede

      const tbl_alumnos = [
        { codigoAlumno: 'ALU-101', codigoSede: 'S01', nombreSede: 'S01 - CAJAMARCA', nombreAlumno: 'Mateo Quispe Ramos', grado: '3° Grado A', aula: 'Aula 101', asistencia: ASISTENCIA.PRESENTE, etapaFlujo: FLOW_STEP.PENDIENTE, horaNotifAula: '—', horaConfirmAula: '—', horaFinProceso: '—', alarmaActiva: false, fechaDia: today },
        { codigoAlumno: 'ALU-102', codigoSede: 'S01', nombreSede: 'S01 - CAJAMARCA', nombreAlumno: 'Sofía Mendoza Díaz', grado: '3° Grado A', aula: 'Aula 101', asistencia: ASISTENCIA.PRESENTE, etapaFlujo: FLOW_STEP.PENDIENTE, horaNotifAula: '—', horaConfirmAula: '—', horaFinProceso: '—', alarmaActiva: false, fechaDia: today },
        { codigoAlumno: 'ALU-103', codigoSede: 'S01', nombreSede: 'S01 - CAJAMARCA', nombreAlumno: 'Liam Huamán Castro', grado: '4° Grado B', aula: 'Aula 104', asistencia: ASISTENCIA.PRESENTE, etapaFlujo: FLOW_STEP.PENDIENTE, horaNotifAula: '—', horaConfirmAula: '—', horaFinProceso: '—', alarmaActiva: false, fechaDia: today },
        { codigoAlumno: 'ALU-104', codigoSede: 'S01', nombreSede: 'S01 - CAJAMARCA', nombreAlumno: 'Valeria Salazar Ríos', grado: 'Inicial 5 Años', aula: 'Aula I-02', asistencia: ASISTENCIA.PRESENTE, etapaFlujo: FLOW_STEP.PENDIENTE, horaNotifAula: '—', horaConfirmAula: '—', horaFinProceso: '—', alarmaActiva: false, fechaDia: today },
        { codigoAlumno: 'ALU-201', codigoSede: 'S02', nombreSede: 'S02 - CAMPOY', nombreAlumno: 'Gabriel Herrera Luna', grado: '2° Grado A', aula: 'Aula 202', asistencia: ASISTENCIA.PRESENTE, etapaFlujo: FLOW_STEP.PENDIENTE, horaNotifAula: '—', horaConfirmAula: '—', horaFinProceso: '—', alarmaActiva: false, fechaDia: today },
        { codigoAlumno: 'ALU-301', codigoSede: 'S03', nombreSede: 'S03 - EL AGUSTINO', nombreAlumno: 'Camila Paredes Soto', grado: '5° Grado A', aula: 'Aula 305', asistencia: ASISTENCIA.PRESENTE, etapaFlujo: FLOW_STEP.PENDIENTE, horaNotifAula: '—', horaConfirmAula: '—', horaFinProceso: '—', alarmaActiva: false, fechaDia: today }
      ];

      const horariosPorNivel = preserveAulasAndHorario && preserveAulasAndHorario.horariosPorNivel
        ? preserveAulasAndHorario.horariosPorNivel
        : buildDefaultHorariosPorNivel();

      return {
        fechaOperativa: today,
        horarioGlobal,
        horariosPorNivel,
        horariosPorSede,
        accessProfiles,
        tbl_aulas_permanentes,
        tbl_alumnos,
        tbl_notificaciones_aula: [],
        tbl_salidas_estudiantes: []
      };
    }

    // Conserva las aulas permanentes, el horario global y la lista de alumnos;
    // cada día todos los alumnos se activan como PRESENTE y se reinician los estados diarios.
    function migrarListaAlumnosParaSiguienteDia(stateObj, nuevaFecha) {
      const targetDate = nuevaFecha || getNextDayISO(stateObj.fechaOperativa);
      stateObj.tbl_alumnos = stateObj.tbl_alumnos.map(a => ({
        codigoAlumno: a.codigoAlumno,
        codigoSede: a.codigoSede,
        nombreSede: a.nombreSede,
        nombreAlumno: a.nombreAlumno,
        grado: a.grado,
        aula: a.aula,
        asistencia: ASISTENCIA.PRESENTE,
        etapaFlujo: FLOW_STEP.PENDIENTE,
        horaNotifAula: '—',
        horaConfirmAula: '—',
        horaFinProceso: '—',
        alarmaActiva: false,
        fechaDia: targetDate
      }));
      stateObj.tbl_notificaciones_aula = [];
      stateObj.tbl_salidas_estudiantes = [];
      stateObj.fechaOperativa = targetDate;
    }

    function ensureDayRollover(stateObj) {
      const today = getTodayISO();
      if (!stateObj.fechaOperativa) {
        stateObj.fechaOperativa = today;
        return;
      }
      if (stateObj.fechaOperativa !== today && stateObj.fechaOperativa < today) {
        migrarListaAlumnosParaSiguienteDia(stateObj, today);
        saveState(stateObj);
      }
    }

    function loadState() {
      try {
        const raw = localStorage.getItem(STORAGE_KEY);
        if (!raw) return buildFreshTablesState();
        const parsed = JSON.parse(raw);
        if (!Array.isArray(parsed.tbl_alumnos) || !Array.isArray(parsed.accessProfiles)) {
          return buildFreshTablesState();
        }
        if (!Array.isArray(parsed.tbl_aulas_permanentes)) {
          parsed.tbl_aulas_permanentes = buildDefaultAulasPermanentes();
        }
        if (!parsed.horarioGlobal) {
          parsed.horarioGlobal = buildDefaultHorarioGlobal();
        }
        if (!parsed.horariosPorNivel) {
          parsed.horariosPorNivel = buildDefaultHorariosPorNivel();
        }
        if (!parsed.horariosPorSede) {
          parsed.horariosPorSede = buildDefaultHorariosPorSede(parsed.horarioGlobal);
        }
        ensureDayRollover(parsed);
        return parsed;
      } catch (e) {
        return buildFreshTablesState();
      }
    }

    function saveState(st = appState) {
      localStorage.setItem(STORAGE_KEY, JSON.stringify(st));
    }

    async function syncTableEvent(action, payload) {
      if (!SHEETS_WEBHOOK_URL) return;
      try {
        await fetch(SHEETS_WEBHOOK_URL, {
          method: 'POST',
          mode: 'no-cors',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ action, ...payload })
        });
      } catch (_) {}
    }

    function migrarAlumnosSiguienteDiaManual() {
      const siguienteFecha = getNextDayISO(appState.fechaOperativa);
      migrarListaAlumnosParaSiguienteDia(appState, siguienteFecha);
      saveState(appState);
      updateHeaderBadges();
      syncTableEvent('MIGRAR_ALUMNOS_DIA', { nuevaFecha: siguienteFecha });
      if (currentUser) renderCurrentTab();
      showToast(`Lista migrada al día ${siguienteFecha}: todos los alumnos en estado PRESENTE.`);
    }

    function actualizarTablasOperativasAdmin() {
      if (!currentUser || currentUser.perfil !== 'ADMINISTRADOR') return;
      const fresh = buildFreshTablesState({
        aulas: appState.tbl_aulas_permanentes,
        horario: appState.horarioGlobal,
        horariosPorNivel: appState.horariosPorNivel,
        horariosPorSede: appState.horariosPorSede
      });
      appState = fresh;
      saveState(appState);
      updateHeaderBadges();
      syncTableEvent('ACTUALIZAR_TABLAS_DIARIAS', { fechaOperativa: appState.fechaOperativa });
      renderCurrentTab();
      showToast('Tablas diarias actualizadas conservando aulas permanentes y horario global.');
    }

    function updateHeaderBadges() {
      const fEl = document.getElementById('fechaOperativaBadge');
      const hEl = document.getElementById('horarioOperativoBadge');
      if (fEl) fEl.textContent = `Día: ${appState.fechaOperativa}`;
      if (hEl) {
        if (currentUser && currentUser.perfil !== 'ADMINISTRADOR' && currentUser.codigoSede !== 'TODAS') {
          const hs = getHorarioDeSede(currentUser.codigoSede);
          hEl.textContent = `Horario (${hs.codigoSede}): ${hs.horaInicioSalida} - ${hs.horaFinSalida}`;
        } else {
          const hg = appState.horarioGlobal || buildDefaultHorarioGlobal();
          hEl.textContent = `Horario Base: ${hg.horaInicioSalida} - ${hg.horaFinSalida}`;
        }
      }
    }

    let appState = loadState();
    let currentUser = null;
    let activeTab = '';
    let selectedSedeForAdmin = SEDES_Y_GRADOS[0].codigoSede;
    let editingAulaId = null;
    let tutorPuertaApellidoQuery = '';
    let tutorPuertaSelectedIds = new Set();

    function getActiveSedeCode() {
      if (!currentUser) return SEDES_Y_GRADOS[0].codigoSede;
      return currentUser.perfil === 'ADMINISTRADOR' ? selectedSedeForAdmin : currentUser.codigoSede;
    }

    function getHorarioAulaBadgeHtml(aulaNombre, sedeCode) {
      const au = appState.tbl_aulas_permanentes.find(
        x => x.codigoSede === sedeCode && x.nombreAula === aulaNombre
      );

        ? 'bg-amber-100 text-amber-900'
        : 'bg-blue-100 text-blue-900';
      return `<div class="font-semibold text-blue-800">${aulaNombre}</div>
              <div class="mt-0.5"><span class="px-1.5 py-0.5 rounded-full text-[10px] font-bold ${badgeStyle}">${ha.nivel}: ${ha.horaIngreso} - ${ha.horaSalida}</span></div>`;

    function getAulasPermanentesDeSede(sedeCode) {
      return appState.tbl_aulas_permanentes.filter(a => a.codigoSede === sedeCode);
    }

    // =========================================================================
    // 4. AUTENTICACIÓN POR SEDE Y PERFIL
    // =========================================================================
    document.getElementById('loginForm').addEventListener('submit', e => {
      e.preventDefault();
      const selectedSede = document.getElementById('loginSede').value;
      const u = document.getElementById('loginUser').value.trim().toLowerCase();
      const p = document.getElementById('loginPass').value;
      const errEl = document.getElementById('loginError');

      const acc = appState.accessProfiles.find(a => {
        if (a.estado !== 'ACTIVO') return false;
        if (a.usuario.toLowerCase() !== u || a.clave !== p) return false;
        if (a.perfil === 'ADMINISTRADOR') return selectedSede === 'TODAS' || selectedSede === a.codigoSede;
        return a.codigoSede === selectedSede;
      });

      if (!acc) {
        errEl.textContent = 'Credenciales o sede inválidas para el perfil seleccionado.';
        errEl.classList.remove('hidden');
        return;

      errEl.classList.add('hidden');

      box.innerHTML = `

          class="px-3 py-1.5 rounded-lg bg-amber-600 hover:bg-amber-700 text-white text-xs font-bold transition shadow">

        </button>

    function enterApp(acc) {
      currentUser = acc;
      editingAulaId = null;

      updateHeaderBadges();
      renderHeaderActionsForRole();

      document.getElementById('loginScreen').classList.add('hidden');
      document.getElementById('appShell').classList.remove('hidden');

      const tabs = getTabsForRole(acc.perfil);

    function getTabsForRole(perfil) {
      if (perfil === 'TUTOR_PUERTA') {

    function renderTabs(tabs) {
      const box = document.getElementById('navTabsContainer');
      box.innerHTML = tabs.map(t => `
        <button type="button" data-tab="${t.id}"
          class="px-4 py-3 text-xs font-bold border-b-2 transition whitespace-nowrap ${

              : 'border-transparent text-slate-300 hover:text-white hover:border-slate-500'

    function renderCurrentTab() {

        return renderCargaAlumnosYAulasPorSede(container);

        return renderTablaProcesosPorSede(container);

        stopContinuousAlarmLoop();

    // =========================================================================

    // =========================================================================
    function eliminarAlumnoSede(codigoAlumno) {
      const sedeCode = getActiveSedeCode();
      const idx = appState.tbl_alumnos.findIndex(a => a.codigoAlumno === codigoAlumno && a.codigoSede === sedeCode);
      if (idx === -1) return;
      const eliminado = appState.tbl_alumnos[idx];
      appState.tbl_alumnos.splice(idx, 1);
      saveState();
      syncTableEvent('DELETE_ALUMNO_SEDE', { codigoAlumno, codigoSede: sedeCode });

    function eliminarAulaPermanenteSede(idAula) {
      const sedeCode = getActiveSedeCode();
      const idx = appState.tbl_aulas_permanentes.findIndex(a => a.idAula === idAula && a.codigoSede === sedeCode);
      if (idx === -1) return;
      const aulaEliminada = appState.tbl_aulas_permanentes[idx];
      appState.tbl_aulas_permanentes.splice(idx, 1);
      if (editingAulaId === idAula) editingAulaId = null;
      saveState();
      syncTableEvent('DELETE_AULA_PERMANENTE', { idAula, codigoSede: sedeCode });
      renderCurrentTab();
      showToast(`Aula permanente "${aulaEliminada.nombreAula}" eliminada en ${sedeCode}.`);
    }

    function importarAlumnosDesdeExcel(file, sedeCode, sedeNombre, aulasSede) {
      if (!file || typeof XLSX === 'undefined') {
        showToast('No se pudo leer el archivo Excel.');
        return;
      }
      const reader = new FileReader();
      reader.onload = evt => {
        try {
          const data = new Uint8Array(evt.target.result);
          const wb = XLSX.read(data, { type: 'array' });
          const firstSheet = wb.Sheets[wb.SheetNames[0]];
          const rows = XLSX.utils.sheet_to_json(firstSheet, { defval: '' });

          if (!rows.length) {
            showToast('El archivo Excel no contiene filas de alumnos.');
            return;
          }

          let agregados = 0;
          rows.forEach((row, idx) => {
            const normalized = Object.fromEntries(
              Object.entries(row).map(([k, v]) => [String(k).trim().toLowerCase(), String(v).trim()])
            );
            const nombreAlumno = normalized['nombre alumno'] || normalized['nombre'] || normalized['alumno'] || '';
            const grado = normalized['grado'] || normalized['grado/seccion'] || normalized['sección'] || normalized['seccion'] || '';
            const aulaRaw = normalized['aula'] || '';

            if (!nombreAlumno) return;

            const gradoFinal = grado || (getSedeConfig(sedeCode).grados[0] || '1° Grado A');
            const aulaFinal = aulaRaw || (aulasSede[0] ? aulasSede[0].nombreAula : 'Aula General');

            if (aulaRaw && !aulasSede.some(au => au.nombreAula.toLowerCase() === aulaRaw.toLowerCase())) {
              appState.tbl_aulas_permanentes.push({
                idAula: `AUL-${sedeCode}-${Date.now()}-${idx}`,
                codigoSede: sedeCode,
                nombreAula: aulaRaw,
                grado: gradoFinal
              });
            }

            appState.tbl_alumnos.push({
              codigoAlumno: `ALU-${sedeCode}-XLS-${Date.now().toString().slice(-4)}-${idx + 1}`,
              codigoSede: sedeCode,
              nombreSede: sedeNombre,
              nombreAlumno,
              grado: gradoFinal,
              aula: aulaFinal,
              asistencia: ASISTENCIA.PRESENTE,
              etapaFlujo: FLOW_STEP.PENDIENTE,
              horaNotifAula: '—',
              horaConfirmAula: '—',
              horaFinProceso: '—',
              alarmaActiva: false,
              fechaDia: appState.fechaOperativa
            });
            agregados++;
          });

          saveState();
          syncTableEvent('IMPORT_EXCEL_ALUMNOS', { codigoSede: sedeCode, agregados, fechaDia: appState.fechaOperativa });
          renderCurrentTab();
          showToast(`${agregados} alumno(s) cargados desde Excel en ${sedeNombre}.`);
        } catch (_) {
          showToast('Error al procesar el archivo Excel.');
        }
      };
      reader.readAsArrayBuffer(file);
    }

    // =========================================================================
    // 6. FLUJO: TUTOR PUERTA NOTIFICA -> ALARMA ACTIVA HASTA "VA A LA PUERTA" ->
    //    TERMINA PROCESO
    // =========================================================================
    function getAsistenciaBadge(asistencia) {
      if (asistencia === ASISTENCIA.FALTA) {
        return `<span class="px-2 py-0.5 rounded-full text-[10px] font-bold bg-rose-100 text-rose-800">FALTA</span>`;
      }
      return `<span class="px-2 py-0.5 rounded-full text-[10px] font-bold bg-emerald-100 text-emerald-800">PRESENTE</span>`;
    }

    function getEtapaBadge(etapa, alarmaActiva) {
      if (etapa === FLOW_STEP.FINALIZADO) {
        return `<span class="px-2 py-0.5 rounded-full text-[10px] font-bold bg-emerald-100 text-emerald-800">PROCESO TERMINADO</span>`;
      }
      if (etapa === FLOW_STEP.CONFIRMADO_AULA) {
        return `<span class="px-2 py-0.5 rounded-full text-[10px] font-bold bg-indigo-100 text-indigo-800">VA A LA PUERTA</span>`;
      }
      if (etapa === FLOW_STEP.NOTIFICADO_AULA) {
        return `<span class="px-2 py-0.5 rounded-full text-[10px] font-bold ${alarmaActiva ? 'bg-rose-100 text-rose-800' : 'bg-blue-100 text-blue-800'}">${alarmaActiva ? 'ALARMA ACTIVA (EN AULA)' : 'NOTIFICADO A AULA'}</span>`;
      }
      return `<span class="px-2 py-0.5 rounded-full text-[10px] font-bold bg-slate-100 text-slate-700">PENDIENTE</span>`;
    }

    // Tutor de puerta notifica a uno o varios alumnos: activa alarma persistente hasta indicar "Va a la puerta"
    function tutorPuertaNotificarAlumnos(codigosAlumnos) {
      const ids = Array.isArray(codigosAlumnos) ? codigosAlumnos : [codigosAlumnos];
      const hora = getNowHHMM();
      let notificadosCount = 0;

      ids.forEach(codigoAlumno => {
        const st = appState.tbl_alumnos.find(a => a.codigoAlumno === codigoAlumno && a.codigoSede === currentUser.codigoSede);
        if (!st || st.asistencia === ASISTENCIA.FALTA || st.etapaFlujo === FLOW_STEP.FINALIZADO) return;

        st.etapaFlujo = FLOW_STEP.NOTIFICADO_AULA;
        st.horaNotifAula = hora;
        st.alarmaActiva = true;
        st.fechaDia = appState.fechaOperativa;
        notificadosCount++;

        appState.tbl_notificaciones_aula.unshift({
          fecha: appState.fechaOperativa,
          horaNotificacion: hora,
          codigoSede: st.codigoSede,
          nombreAlumno: st.nombreAlumno,
          grado: st.grado,
          aula: st.aula,
          tutorPuerta: currentUser.nombre,
          estado: 'ALARMA_ACTIVA'
        });
      });

      if (!notificadosCount) {
        showToast('No hay alumnos presentes elegibles para notificar.');
        return;
      }

      saveState();
      syncTableEvent('NOTIFICAR_ALUMNOS_AULA', { codigosAlumnos: ids, horaNotifAula: hora, fecha: appState.fechaOperativa });
      renderCurrentTab();
      showToast(`Alarma activada para ${notificadosCount} alumno(s) hasta indicar que van a la puerta.`);
    }

    function tutorAulaMarcarFalta(codigoAlumno) {
      const st = appState.tbl_alumnos.find(a => a.codigoAlumno === codigoAlumno && a.codigoSede === currentUser.codigoSede);
      if (!st) return;

      st.asistencia = st.asistencia === ASISTENCIA.FALTA ? ASISTENCIA.PRESENTE : ASISTENCIA.FALTA;
      if (st.asistencia === ASISTENCIA.FALTA) {
        st.alarmaActiva = false;
        st.etapaFlujo = FLOW_STEP.PENDIENTE;
      }

      saveState();
      syncTableEvent('TOGGLE_FALTA_AULA', { codigoAlumno, asistencia: st.asistencia, fecha: appState.fechaOperativa });
      renderCurrentTab();
      showToast(`${st.nombreAlumno} marcado como ${st.asistencia}.`);
    }

    // La alarma NO se desactiva hasta que se indique que el alumno o los alumnos van a la puerta
    function tutorAulaIndicarVanAPuerta(codigosAlumnos) {
      const ids = Array.isArray(codigosAlumnos) ? codigosAlumnos : [codigosAlumnos];
      const hora = getNowHHMM();
      let confirmados = 0;

      ids.forEach(codigoAlumno => {
        const st = appState.tbl_alumnos.find(a => a.codigoAlumno === codigoAlumno && a.codigoSede === currentUser.codigoSede);
        if (!st || st.asistencia !== ASISTENCIA.PRESENTE) return;
        if (st.etapaFlujo !== FLOW_STEP.NOTIFICADO_AULA && !st.alarmaActiva) return;

        st.etapaFlujo = FLOW_STEP.CONFIRMADO_AULA;
        st.horaConfirmAula = hora;
        st.alarmaActiva = false;
        confirmados++;
      });

      if (!confirmados) return;

      saveState();
      syncTableEvent('INDICAR_ALUMNOS_A_PUERTA', { codigosAlumnos: ids, horaConfirmAula: hora, fecha: appState.fechaOperativa });
      renderCurrentTab();
      showToast(`Alarma desactivada: se indicó que ${confirmados} alumno(s) van a la puerta.`);
    }

    function terminarProcesoSalida(codigoAlumno) {
      const st = appState.tbl_alumnos.find(a => a.codigoAlumno === codigoAlumno && a.codigoSede === currentUser.codigoSede);
      if (!st) return;

      const hora = getNowHHMM();
      st.etapaFlujo = FLOW_STEP.FINALIZADO;
      st.horaFinProceso = hora;
      st.alarmaActiva = false;

      appState.tbl_salidas_estudiantes.unshift({
        fecha: appState.fechaOperativa,
        horaFinProceso: hora,
        codigoSede: st.codigoSede,
        nombreAlumno: st.nombreAlumno,
        grado: st.grado,
        aula: st.aula,
        horaNotifAula: st.horaNotifAula,
        horaConfirmAula: st.horaConfirmAula,
        estado: 'PROCESO_TERMINADO'
      });

      saveState();
      syncTableEvent('TERMINAR_PROCESO', { codigoAlumno, horaFinProceso: hora, fecha: appState.fechaOperativa });
      renderCurrentTab();
      showToast(`Proceso terminado para ${st.nombreAlumno}.`);
    }

    function coincideApellido(nombreCompleto, query) {
      const q = (query || '').trim().toLowerCase();
      if (!q) return true;
      const partes = String(nombreCompleto || '').toLowerCase().split(/\s+/).filter(Boolean);
      // Coincide si el texto coincide con cualquier palabra del nombre/apellido (priorizando apellidos/palabras completas o prefijos)
      return partes.some(p => p.includes(q)) || String(nombreCompleto || '').toLowerCase().includes(q);
    }

          selectedSedeHorarioEdit = e.target.value;
          selectedAulaHorarioId = null;
          renderCurrentTab();
        });
      }

      const selAulaEl = document.getElementById('selAulaHorario');
      if (selAulaEl) {
        selAulaEl.addEventListener('change', e => {
          selectedAulaHorarioId = e.target.value;
          renderCurrentTab();
        });
      }

      const btnCargarBaseNivelAula = document.getElementById('btnCargarBaseNivelAula');
      if (btnCargarBaseNivelAula) {
        btnCargarBaseNivelAula.addEventListener('click', () => {
          const nivSel = document.getElementById('selNivelAulaHorario').value;
          const hNiv = getHorarioPorNivel(nivSel);
          document.getElementById('inpAulaHorarioIngreso').value = hNiv.horaIngreso;
          document.getElementById('inpAulaHorarioSalida').value = hNiv.horaSalida;
          showToast(`Cargado horario base de ${nivSel}: ${hNiv.horaIngreso} - ${hNiv.horaSalida}.`);
        });
      }

      document.getElementById('asignarHorarioAulaForm').addEventListener('submit', e => {
        e.preventDefault();
        const idAula = document.getElementById('selAulaHorario').value;
        if (!idAula) {
          showToast('Seleccione un aula o cree una primero.');
          return;
        }
        const au = appState.tbl_aulas_permanentes.find(x => x.idAula === idAula);
        if (!au) return;

        const nivel = document.getElementById('selNivelAulaHorario').value || 'Primaria';
        const horaIngreso = document.getElementById('inpAulaHorarioIngreso').value;
        const horaSalida = document.getElementById('inpAulaHorarioSalida').value;

        au.nivel = nivel;
        au.horaIngreso = horaIngreso;
        au.horaSalida = horaSalida;
        au.diasActivos = getHorarioPorNivel(nivel).diasActivos;
        selectedAulaHorarioId = au.idAula;

        saveState();
        syncTableEvent('ASSIGN_HORARIO_AULA', { aula: au });
        renderCurrentTab();
        showToast(`Horario ${horaIngreso} - ${horaSalida} (${nivel}) asignado a ${au.nombreAula}.`);
      });

      document.getElementById('crearAulaConHorarioForm').addEventListener('submit', e => {
        e.preventDefault();
        const nombreAula = document.getElementById('inpNuevaAulaRapidaNombre').value.trim();
        const nivel = document.getElementById('inpNuevaAulaRapidaNivel').value || 'Primaria';
        if (!nombreAula) return;

        const hNiv = getHorarioPorNivel(nivel);
        const sCfg = getSedeConfig(selectedSedeHorarioEdit);
        const nuevaAula = {
          idAula: `AUL-${sCfg.codigoSede}-${Date.now().toString().slice(-4)}`,
          codigoSede: sCfg.codigoSede,
          nombreAula,
          grado: sCfg.grados[0] || '',
          nivel,
          horaIngreso: hNiv.horaIngreso,
          horaSalida: hNiv.horaSalida,
          diasActivos: hNiv.diasActivos
        };
        appState.tbl_aulas_permanentes.push(nuevaAula);
        selectedAulaHorarioId = nuevaAula.idAula;
        saveState();
        syncTableEvent('CREATE_AULA_WITH_HORARIO', { aula: nuevaAula });
        renderCurrentTab();
        showToast(`Aula "${nombreAula}" creada en ${sCfg.codigoSede} con horario ${nivel} (${hNiv.horaIngreso} - ${hNiv.horaSalida}).`);
      });

      container.querySelectorAll('[data-pick-aula-horario]').forEach(btn => {
        btn.addEventListener('click', () => {
          selectedAulaHorarioId = btn.dataset.pickAulaHorario;
          renderCurrentTab();
        });
      });

      document.getElementById('horarioSedeForm').addEventListener('submit', e => {
        e.preventDefault();
        const code = selectedSedeHorarioEdit;
        const s = getSedeConfig(code);
        const inicio = document.getElementById('inpSedeHoraInicio').value;
        const fin = document.getElementById('inpSedeHoraFin').value;
        const dias = document.getElementById('inpSedeDiasActivos').value.trim() || 'Lunes a Viernes';

        appState.horariosPorSede[code] = {
          codigoSede: s.codigoSede,
          nombreSede: s.nombreSede,
          horaInicioSalida: inicio,
          horaFinSalida: fin,
          diasActivos: dias,
          actualizadoEn: getTodayISO()
        };
        saveState();
        updateHeaderBadges();
        syncTableEvent('UPDATE_HORARIO_SEDE', { horarioSede: appState.horariosPorSede[code] });
        renderCurrentTab();
        showToast(`Horario actualizado para ${s.nombreSede} (${inicio} - ${fin}).`);
      });

      document.getElementById('btnEliminarHorarioSedeActual').addEventListener('click', () => {
        eliminarHorarioDeSede(selectedSedeHorarioEdit);
      });

      container.querySelectorAll('[data-edit-horario-sede]').forEach(btn => {
        btn.addEventListener('click', () => {
          selectedSedeHorarioEdit = btn.dataset.editHorarioSede;
          selectedAulaHorarioId = null;
          renderCurrentTab();
        });
      });

      container.querySelectorAll('[data-del-horario-sede]').forEach(btn => {
        btn.addEventListener('click', () => eliminarHorarioDeSede(btn.dataset.delHorarioSede));
      });
    }
  </script>
</body>
</html>
