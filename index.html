    function getTodayISO() {
      const now = new Date();
      const y = now.getFullYear();
      const m = String(now.getMonth() + 1).padStart(2, '0');
      const d = String(now.getDate()).padStart(2, '0');
      return `${y}-${m}-${d}`;
    }

    function getNextDayISO(isoDate) {
      const base = isoDate ? new Date(`${isoDate}T12:00:00`) : new Date();
      base.setDate(base.getDate() + 1);
      const y = base.getFullYear();
      const m = String(base.getMonth() + 1).padStart(2, '0');
      const d = String(base.getDate()).padStart(2, '0');
      return `${y}-${m}-${d}`;

    let audioCtxInstance = null;

    function playSingleAlarmTone() {
      try {
        const AudioCtx = window.AudioContext || window.webkitAudioContext;
        if (!AudioCtx) return;
        if (!audioCtxInstance) {
          audioCtxInstance = new AudioCtx();
        }
        if (audioCtxInstance.state === 'suspended') {
          audioCtxInstance.resume();
        }

        const now = audioCtxInstance.currentTime;
        const notes = [
          { freq: 920, start: 0, dur: 0.16 },
          { freq: 1220, start: 0.18, dur: 0.18 }
        ];

        notes.forEach(n => {
          const osc = audioCtxInstance.createOscillator();
          const gain = audioCtxInstance.createGain();
          osc.type = 'sawtooth';
          osc.frequency.setValueAtTime(n.freq, now + n.start);

          gain.gain.setValueAtTime(0.001, now + n.start);
          gain.gain.exponentialRampToValueAtTime(0.22, now + n.start + 0.02);
          gain.gain.exponentialRampToValueAtTime(0.001, now + n.start + n.dur);

          osc.connect(gain);
          gain.connect(audioCtxInstance.destination);

          osc.start(now + n.start);
          osc.stop(now + n.start + n.dur + 0.02);
        });
      } catch (_) {}
    }

    function syncContinuousAlarmLoop() {
      const shouldRing = !!(
        currentUser &&
        currentUser.perfil === 'TUTOR_AULA' &&
        appState.tbl_alumnos.some(
          a => a.codigoSede === currentUser.codigoSede &&
               a.alarmaActiva &&
               a.etapaFlujo === FLOW_STEP.NOTIFICADO_AULA &&
               a.asistencia === ASISTENCIA.PRESENTE
        )
      );

      if (shouldRing) {
        playSingleAlarmTone();
        if (!alarmIntervalId) {
          alarmIntervalId = setInterval(() => {
            const stillActive = currentUser &&
              currentUser.perfil === 'TUTOR_AULA' &&
              appState.tbl_alumnos.some(
                a => a.codigoSede === currentUser.codigoSede &&
                     a.alarmaActiva &&

                     a.asistencia === ASISTENCIA.PRESENTE
              );
            if (stillActive) {
              playSingleAlarmTone();
            } else {
              stopContinuousAlarmLoop();

          }, 2600);
        }
      } else {

    function ensureDayRollover(stateObj) {
      const today = getTodayISO();
      if (!stateObj.fechaOperativa) {
        stateObj.fechaOperativa = today;
        return;
      }
      if (stateObj.fechaOperativa !== today && stateObj.fechaOperativa < today) {
        migrarListaAlumnosParaSiguienteDia(stateObj, today);

    function loadState() {

        const raw = localStorage.getItem(STORAGE_KEY);
        if (!raw) return buildFreshTablesState();
        const parsed = JSON.parse(raw);
        if (!Array.isArray(parsed.tbl_alumnos) || !Array.isArray(parsed.accessProfiles)) {
          return buildFreshTablesState();
        }
        if (!Array.isArray(parsed.tbl_aulas_permanentes)) {
          parsed.tbl_aulas_permanentes = buildDefaultAulasPermanentes();
        }
        if (!parsed.horarioGlobal) {
          parsed.horarioGlobal = buildDefaultHorarioGlobal();
        }
        if (!parsed.horariosPorNivel) {
          parsed.horariosPorNivel = buildDefaultHorariosPorNivel();
        }
        if (!parsed.horariosPorSede) {
          parsed.horariosPorSede = buildDefaultHorariosPorSede(parsed.horarioGlobal);
        }
        ensureDayRollover(parsed);
        return parsed;
      } catch (e) {
        return buildFreshTablesState();
      }
    }

    function getSyncBucketId() {
      const custom = localStorage.getItem('aulasalida_custom_sync_bucket');
      return (custom && custom.trim()) ? custom.trim() : DEFAULT_SYNC_BUCKET_ID;
    }

    function getSyncEndpoints() {
      const customUrl = localStorage.getItem('aulasalida_custom_sync_url');
      if (customUrl && customUrl.trim()) {
        return [{ type: 'custom', pushUrl: customUrl.trim(), pullUrl: customUrl.trim(), method: 'POST' }];
      }
      const bucket = encodeURIComponent(getSyncBucketId());
      return [
        {
          type: 'kvdb',
          pushUrl: `https://kvdb.io/${bucket}/estado_global`,
          pullUrl: `https://kvdb.io/${bucket}/estado_global`,
          method: 'POST'
        },
        {
          type: 'ntfy',
          pushUrl: `https://ntfy.sh/${bucket}_aulasalida_state`,
          pullUrl: `https://ntfy.sh/${bucket}_aulasalida_state/raw`,
          method: 'PUT'
        }
      ];
    }

    function normalizeSyncedState(parsed, fallback = null) {
      if (!parsed || typeof parsed !== 'object') return fallback;
      if (!Array.isArray(parsed.tbl_alumnos) || !Array.isArray(parsed.accessProfiles)) {
        return fallback;
      }
      if (!Array.isArray(parsed.tbl_aulas_permanentes)) {
        parsed.tbl_aulas_permanentes = fallback && Array.isArray(fallback.tbl_aulas_permanentes)
          ? fallback.tbl_aulas_permanentes
          : buildDefaultAulasPermanentes();
      }
      if (!parsed.horarioGlobal) {
        parsed.horarioGlobal = (fallback && fallback.horarioGlobal) || buildDefaultHorarioGlobal();
      }
      if (!parsed.horariosPorNivel) {
        parsed.horariosPorNivel = (fallback && fallback.horariosPorNivel) || buildDefaultHorariosPorNivel();
      }
      if (!parsed.horariosPorSede) {
        parsed.horariosPorSede = (fallback && fallback.horariosPorSede) || buildDefaultHorariosPorSede(parsed.horarioGlobal);
      }
      parsed._updatedAt = Number(parsed._updatedAt || 0);
      return parsed;
    }

    function hasMeaningfulDiff(a, b) {
      if (!a || !b) return true;
      const ca = Object.assign({}, a);
      const cb = Object.assign({}, b);
      delete ca._updatedAt;
      delete cb._updatedAt;
      return JSON.stringify(ca) !== JSON.stringify(cb);
    }

    function applyIncomingState(incomingRaw, sourceLabel = 'Remoto') {
      const incoming = normalizeSyncedState(incomingRaw, null);
      if (!incoming) return false;
      const currentTs = Number((appState && appState._updatedAt) || 0);
      const incomingTs = Number(incoming._updatedAt || 0);

      if (incomingTs > 0 && currentTs > 0 && incomingTs < currentTs) {
        return false;
      }
      if (incomingTs > 0 && incomingTs === currentTs && !hasMeaningfulDiff(appState, incoming)) {
        return false;
      }

      isApplyingRemoteState = true;
      try {
        ensureDayRollover(incoming);
        appState = incoming;
        lastPushedSerialized = JSON.stringify(appState);
        localStorage.setItem(STORAGE_KEY, JSON.stringify(appState));
        lastSyncedAt = new Date().toLocaleTimeString('es-PE', { hour: '2-digit', minute: '2-digit', second: '2-digit', hour12: false });
        syncStatusText = `Remoto OK (${sourceLabel} ${lastSyncedAt})`;
        updateHeaderBadges();
        if (currentUser) {
          renderCurrentTab();
          syncContinuousAlarmLoop();
        }
      } finally {
        isApplyingRemoteState = false;
      }
      return true;
    }

    async function pushStateToCloud(st) {
      const endpoints = getSyncEndpoints();
      const payloadStr = JSON.stringify(st);
      if (payloadStr === lastPushedSerialized) return true;

      for (const ep of endpoints) {
        try {
          const res = await fetch(ep.pushUrl, {
            method: ep.method || 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: payloadStr
          });
          if (res.ok) {
            lastPushedSerialized = payloadStr;
            remoteSyncSource = ep.type.toUpperCase();
            lastSyncedAt = new Date().toLocaleTimeString('es-PE', { hour: '2-digit', minute: '2-digit', second: '2-digit', hour12: false });
            syncStatusText = `Nube ${remoteSyncSource} (${lastSyncedAt})`;
            updateHeaderBadges();
            return true;
          }
        } catch (_) {}
      }

      syncStatusText = 'Reintentando nube...';
      updateHeaderBadges();
      return false;
    }

    async function pullStateFromCloud(forceApply = false) {
      if (activeSyncInFlight) return false;
      activeSyncInFlight = true;
      const endpoints = getSyncEndpoints();
      try {
        for (const ep of endpoints) {
          try {
            const sep = ep.pullUrl.includes('?') ? '&' : '?';
            const res = await fetch(`${ep.pullUrl}${sep}_t=${Date.now()}`, { cache: 'no-store' });
            if (!res.ok) continue;
            const text = await res.text();
            if (!text || !text.trim()) continue;
            let remoteData = JSON.parse(text);
            if (remoteData && typeof remoteData === 'object' && typeof remoteData.message === 'string') {
              try { remoteData = JSON.parse(remoteData.message); } catch (_) {}
            }
            const norm = normalizeSyncedState(remoteData, null);
            if (!norm) continue;

            remoteSyncSource = ep.type.toUpperCase();
            const currentTs = Number((appState && appState._updatedAt) || 0);
            const remoteTs = Number(norm._updatedAt || 0);

            if (forceApply || remoteTs > currentTs || hasMeaningfulDiff(appState, norm)) {
              return applyIncomingState(norm, remoteSyncSource);
            }
            lastSyncedAt = new Date().toLocaleTimeString('es-PE', { hour: '2-digit', minute: '2-digit', second: '2-digit', hour12: false });
            syncStatusText = `Nube ${remoteSyncSource} (${lastSyncedAt})`;
            updateHeaderBadges();
            return false;
          } catch (_) {}
        }
        return false;
      } finally {
        activeSyncInFlight = false;
      }
    }

    function startCloudSyncLoop() {
      if (remoteSyncTimer) clearInterval(remoteSyncTimer);
      pullStateFromCloud(false);
      remoteSyncTimer = setInterval(() => {

    function saveState(st = appState) {
      if (!st || typeof st !== 'object') return;
      if (!isApplyingRemoteState) {
        st._updatedAt = Date.now();

      localStorage.setItem(STORAGE_KEY, JSON.stringify(st));
      if (!isApplyingRemoteState) {
        if (syncChannel) {

      if (perfil === 'TUTOR_PUERTA') {

      }
      if (perfil === 'TUTOR_AULA') {

        ];
      }
      return [
        { id: 'cargaAlumnos', label: 'Carga de Alumnos y Aulas (Por Sede)' },
        { id: 'processBySede', label: 'Tabla de Procesos (Por Sede)' },
        { id: 'horarioGlobal', label: 'Horario Global (Todas las Sedes)' }

    function renderTabs(tabs) {
      const box = document.getElementById('navTabsContainer');
      box.innerHTML = tabs.map(t => `
        <button type="button" data-tab="${t.id}"
          class="px-4 py-3 text-xs font-bold border-b-2 transition whitespace-nowrap ${
            t.id === activeTab
              ? 'border-blue-400 text-white bg-slate-900/50'
              : 'border-transparent text-slate-300 hover:text-white hover:border-slate-500'
          }">${t.label}</button>
      `).join('');

      box.querySelectorAll('[data-tab]').forEach(btn => {
        btn.addEventListener('click', () => {
          activeTab = btn.dataset.tab;
          renderTabs(getTabsForRole(currentUser.perfil));
          renderCurrentTab();

    function renderCurrentTab() {
      ensureDayRollover(appState);
      updateHeaderBadges();

      if (currentUser && currentUser.perfil === 'TUTOR_PUERTA') {
        activeTab = 'tutorFlow';
        stopContinuousAlarmLoop();
        return renderTutorGateFlow(container);
      }
      if (currentUser && currentUser.perfil === 'TUTOR_AULA') {
        activeTab = 'aulaModule';
        return renderTutorAulaModule(container);
      }
      if (activeTab === 'cargaAlumnos') {
        stopContinuousAlarmLoop();
        return renderCargaAlumnosYAulasPorSede(container);
      }
      if (activeTab === 'processBySede') {
        stopContinuousAlarmLoop();
        return renderTablaProcesosPorSede(container);
      }
      if (activeTab === 'horarioGlobal') {
        stopContinuousAlarmLoop();
        return renderHorarioGlobalAdmin(container);

      stopContinuousAlarmLoop();

    function eliminarAulaPermanenteSede(idAula) {
      const sedeCode = getActiveSedeCode();
      const idx = appState.tbl_aulas_permanentes.findIndex(a => a.idAula === idAula && a.codigoSede === sedeCode);

    function importarAlumnosDesdeExcel(file, sedeCode, sedeNombre, aulasSede) {
      if (!file || typeof XLSX === 'undefined') {
        showToast('No se pudo leer el archivo Excel.');
        return;
      }
      const reader = new FileReader();
      reader.onload = evt => {
        try {
          const data = new Uint8Array(evt.target.result);
          const wb = XLSX.read(data, { type: 'array' });
          const firstSheet = wb.Sheets[wb.SheetNames[0]];
          const rows = XLSX.utils.sheet_to_json(firstSheet, { defval: '' });

          if (!rows.length) {
            showToast('El archivo Excel no contiene filas de alumnos.');
            return;
          }

          let agregados = 0;
          rows.forEach((row, idx) => {
            const normalized = Object.fromEntries(
              Object.entries(row).map(([k, v]) => [String(k).trim().toLowerCase(), String(v).trim()])
            );
            const nombreAlumno = normalized['nombre alumno'] || normalized['nombre'] || normalized['alumno'] || '';
            const grado = normalized['grado'] || normalized['grado/seccion'] || normalized['sección'] || normalized['seccion'] || '';
            const aulaRaw = normalized['aula'] || '';

            if (!nombreAlumno) return;

            const gradoFinal = grado || (getSedeConfig(sedeCode).grados[0] || '1° Grado A');
            const aulaFinal = aulaRaw || (aulasSede[0] ? aulasSede[0].nombreAula : 'Aula General');

            if (aulaRaw && !aulasSede.some(au => au.nombreAula.toLowerCase() === aulaRaw.toLowerCase())) {
              appState.tbl_aulas_permanentes.push({
                idAula: `AUL-${sedeCode}-${Date.now()}-${idx}`,
                codigoSede: sedeCode,
                nombreAula: aulaRaw,
                grado: gradoFinal
              });
            }

            appState.tbl_alumnos.push({
              codigoAlumno: `ALU-${sedeCode}-XLS-${Date.now().toString().slice(-4)}-${idx + 1}`,
              codigoSede: sedeCode,
              nombreSede: sedeNombre,
              nombreAlumno,
              grado: gradoFinal,
              aula: aulaFinal,
              asistencia: ASISTENCIA.PRESENTE,
              etapaFlujo: FLOW_STEP.PENDIENTE,
              horaNotifAula: '—',
              horaConfirmAula: '—',
              horaFinProceso: '—',
              alarmaActiva: false,
              fechaDia: appState.fechaOperativa
            });
            agregados++;
          });

          saveState();
          syncTableEvent('IMPORT_EXCEL_ALUMNOS', { codigoSede: sedeCode, agregados, fechaDia: appState.fechaOperativa });
          renderCurrentTab();
          showToast(`${agregados} alumno(s) cargados desde Excel en ${sedeNombre}.`);
        } catch (_) {
          showToast('Error al procesar el archivo Excel.');
        }
      };
      reader.readAsArrayBuffer(file);
    }

    // =========================================================================
    // 6. FLUJO: TUTOR PUERTA NOTIFICA -> ALARMA ACTIVA HASTA "VA A LA PUERTA" ->
    //    TERMINA PROCESO
    // =========================================================================
    function getAsistenciaBadge(asistencia) {
      if (asistencia === ASISTENCIA.FALTA) {
        return `<span class="px-2 py-0.5 rounded-full text-[10px] font-bold bg-rose-100 text-rose-800">FALTA</span>`;
      }
      return `<span class="px-2 py-0.5 rounded-full text-[10px] font-bold bg-emerald-100 text-emerald-800">PRESENTE</span>`;
    }

    function getEtapaBadge(etapa, alarmaActiva) {
      if (etapa === FLOW_STEP.FINALIZADO) {
        return `<span class="px-2 py-0.5 rounded-full text-[10px] font-bold bg-emerald-100 text-emerald-800">PROCESO TERMINADO</span>`;
      }
      if (etapa === FLOW_STEP.CONFIRMADO_AULA) {
        return `<span class="px-2 py-0.5 rounded-full text-[10px] font-bold bg-indigo-100 text-indigo-800">VA A LA PUERTA</span>`;
      }
      if (etapa === FLOW_STEP.NOTIFICADO_AULA) {
        return `<span class="px-2 py-0.5 rounded-full text-[10px] font-bold ${alarmaActiva ? 'bg-rose-100 text-rose-800' : 'bg-blue-100 text-blue-800'}">${alarmaActiva ? 'ALARMA ACTIVA (EN AULA)' : 'NOTIFICADO A AULA'}</span>`;
      }
      return `<span class="px-2 py-0.5 rounded-full text-[10px] font-bold bg-slate-100 text-slate-700">PENDIENTE</span>`;
    }

    // Tutor de puerta notifica a uno o varios alumnos: activa alarma persistente hasta indicar "Va a la puerta"
    function tutorPuertaNotificarAlumnos(codigosAlumnos) {
      const ids = Array.isArray(codigosAlumnos) ? codigosAlumnos : [codigosAlumnos];
      const hora = getNowHHMM();
      let notificadosCount = 0;

      ids.forEach(codigoAlumno => {
        const st = appState.tbl_alumnos.find(a => a.codigoAlumno === codigoAlumno && a.codigoSede === currentUser.codigoSede);
        if (!st || st.asistencia === ASISTENCIA.FALTA || st.etapaFlujo === FLOW_STEP.FINALIZADO) return;

        st.etapaFlujo = FLOW_STEP.NOTIFICADO_AULA;
        st.horaNotifAula = hora;
        st.alarmaActiva = true;
        st.fechaDia = appState.fechaOperativa;
        notificadosCount++;

        appState.tbl_notificaciones_aula.unshift({
          fecha: appState.fechaOperativa,
          horaNotificacion: hora,
          codigoSede: st.codigoSede,
          nombreAlumno: st.nombreAlumno,
          grado: st.grado,
          aula: st.aula,
          tutorPuerta: currentUser.nombre,
          estado: 'ALARMA_ACTIVA'
        });
      });

      if (!notificadosCount) {
        showToast('No hay alumnos presentes elegibles para notificar.');
        return;
      }

      saveState();
      syncTableEvent('NOTIFICAR_ALUMNOS_AULA', { codigosAlumnos: ids, horaNotifAula: hora, fecha: appState.fechaOperativa });
      renderCurrentTab();
      showToast(`Alarma activada para ${notificadosCount} alumno(s) hasta indicar que van a la puerta.`);
    }

    function tutorAulaMarcarFalta(codigoAlumno) {
      const st = appState.tbl_alumnos.find(a => a.codigoAlumno === codigoAlumno && a.codigoSede === currentUser.codigoSede);
      if (!st) return;

      st.asistencia = st.asistencia === ASISTENCIA.FALTA ? ASISTENCIA.PRESENTE : ASISTENCIA.FALTA;
      if (st.asistencia === ASISTENCIA.FALTA) {
        st.alarmaActiva = false;
        st.etapaFlujo = FLOW_STEP.PENDIENTE;
      }

      saveState();
      syncTableEvent('TOGGLE_FALTA_AULA', { codigoAlumno, asistencia: st.asistencia, fecha: appState.fechaOperativa });
      renderCurrentTab();
      showToast(`${st.nombreAlumno} marcado como ${st.asistencia}.`);
    }

    // La alarma NO se desactiva hasta que se indique que el alumno o los alumnos van a la puerta
    function tutorAulaIndicarVanAPuerta(codigosAlumnos) {
      const ids = Array.isArray(codigosAlumnos) ? codigosAlumnos : [codigosAlumnos];
      const hora = getNowHHMM();
      let confirmados = 0;

      ids.forEach(codigoAlumno => {
        const st = appState.tbl_alumnos.find(a => a.codigoAlumno === codigoAlumno && a.codigoSede === currentUser.codigoSede);
        if (!st || st.asistencia !== ASISTENCIA.PRESENTE) return;
        if (st.etapaFlujo !== FLOW_STEP.NOTIFICADO_AULA && !st.alarmaActiva) return;

        st.etapaFlujo = FLOW_STEP.CONFIRMADO_AULA;
        st.horaConfirmAula = hora;
        st.alarmaActiva = false;
        confirmados++;
      });

      if (!confirmados) return;

      saveState();
      syncTableEvent('INDICAR_ALUMNOS_A_PUERTA', { codigosAlumnos: ids, horaConfirmAula: hora, fecha: appState.fechaOperativa });
      renderCurrentTab();
      showToast(`Alarma desactivada: se indicó que ${confirmados} alumno(s) van a la puerta.`);
    }

    function terminarProcesoSalida(codigoAlumno) {
      const st = appState.tbl_alumnos.find(a => a.codigoAlumno === codigoAlumno && a.codigoSede === currentUser.codigoSede);
      if (!st) return;

      const hora = getNowHHMM();
      st.etapaFlujo = FLOW_STEP.FINALIZADO;
      st.horaFinProceso = hora;
      st.alarmaActiva = false;

      appState.tbl_salidas_estudiantes.unshift({
        fecha: appState.fechaOperativa,
        horaFinProceso: hora,
        codigoSede: st.codigoSede,
        nombreAlumno: st.nombreAlumno,
        grado: st.grado,
        aula: st.aula,
        horaNotifAula: st.horaNotifAula,
        horaConfirmAula: st.horaConfirmAula,
        estado: 'PROCESO_TERMINADO'
      });

      saveState();
      syncTableEvent('TERMINAR_PROCESO', { codigoAlumno, horaFinProceso: hora, fecha: appState.fechaOperativa });
      renderCurrentTab();
      showToast(`Proceso terminado para ${st.nombreAlumno}.`);
    }

    function coincideApellido(nombreCompleto, query) {
      const q = (query || '').trim().toLowerCase();
      if (!q) return true;
      const partes = String(nombreCompleto || '').toLowerCase().split(/\s+/).filter(Boolean);
      // Coincide si el texto coincide con cualquier palabra del nombre/apellido (priorizando apellidos/palabras completas o prefijos)
      return partes.some(p => p.includes(q)) || String(nombreCompleto || '').toLowerCase().includes(q);
    }

          </div>

          <div class="bg-white rounded-2xl border border-slate-200 p-5 shadow-sm">
            <h2 class="text-base font-extrabold text-slate-900 mb-1">Módulo Tutor de Aula — ${sedeCfg.nombreSede} (${appState.fechaOperativa})</h2>
            <p class="text-xs text-slate-500 mb-4">Al indicar que el alumno va a la puerta se desactiva su alarma. Todos inician como <strong>PRESENTE</strong> cada día.</p>

            <div class="overflow-x-auto border border-slate-200 rounded-xl">
              <table class="w-full text-left text-xs">
                <thead class="bg-slate-50 text-slate-600 font-bold border-b border-slate-200">
                  <tr>
                    <th class="px-3 py-2.5">Nombre Alumno</th>
                    <th class="px-3 py-2.5">Grado</th>
                    <th class="px-3 py-2.5">Aula</th>
                    <th class="px-3 py-2.5">Asistencia</th>
                    <th class="px-3 py-2.5">Estado</th>
                    <th class="px-3 py-2.5">Hora Notif.</th>
                    <th class="px-3 py-2.5">Va a Puerta</th>
                    <th class="px-3 py-2.5 text-right">Acciones de Aula</th>
                  </tr>
                </thead>
                <tbody class="divide-y divide-slate-100">
                  ${alumnosSede.map(a => `
                    <tr class="${a.alarmaActiva ? 'bg-rose-50/80' : ''}">
                      <td class="px-3 py-2.5 font-bold text-slate-900">${a.nombreAlumno}</td>
                      <td class="px-3 py-2.5 text-slate-700">${a.grado}</td>
                      <td class="px-3 py-2.5 font-semibold text-blue-800">${a.aula}</td>
                      <td class="px-3 py-2.5">${getAsistenciaBadge(a.asistencia)}</td>
                      <td class="px-3 py-2.5">${getEtapaBadge(a.etapaFlujo, a.alarmaActiva)}</td>
                      <td class="px-3 py-2.5 font-mono text-slate-600">${a.horaNotifAula}</td>
                      <td class="px-3 py-2.5 font-mono text-slate-600">${a.horaConfirmAula}</td>
                      <td class="px-3 py-2.5 text-right space-x-1.5 whitespace-nowrap">
                        <button type="button" data-falta-aula="${a.codigoAlumno}"
                          class="px-2.5 py-1 rounded-lg ${a.asistencia === ASISTENCIA.FALTA ? 'bg-emerald-100 text-emerald-900' : 'bg-rose-100 text-rose-800'} font-bold text-[11px]">
                          ${a.asistencia === ASISTENCIA.FALTA ? 'Marcar Presente' : 'Indicar Falta'}
                        </button>
                        ${a.asistencia === ASISTENCIA.PRESENTE && (a.alarmaActiva || a.etapaFlujo === FLOW_STEP.NOTIFICADO_AULA) ? `
                          <button type="button" data-ir-puerta="${a.codigoAlumno}"
                            class="px-2.5 py-1 rounded-lg bg-indigo-600 hover:bg-indigo-700 text-white font-bold text-[11px]">
                            Va a la Puerta
                          </button>
                        ` : ''}
                        ${a.asistencia === ASISTENCIA.PRESENTE && a.etapaFlujo === FLOW_STEP.CONFIRMADO_AULA ? `
                          <button type="button" data-terminar-aula="${a.codigoAlumno}"
                            class="px-2.5 py-1 rounded-lg bg-emerald-600 hover:bg-emerald-700 text-white font-bold text-[11px]">
                            Terminar Proceso
                          </button>
                        ` : ''}
                        ${a.etapaFlujo === FLOW_STEP.FINALIZADO ? `
                          <span class="text-[11px] font-mono text-emerald-700 font-bold">Fin ${a.horaFinProceso}</span>
                        ` : ''}
                      </td>
                    </tr>
                  `).join('')}
                </tbody>
              </table>
            </div>
          </div>
        </div>
      `;

      const todosBtn = document.getElementById('indicarTodosPuertaBtn');
      if (todosBtn) {
        todosBtn.addEventListener('click', () => {
          tutorAulaIndicarVanAPuerta(alumnosConAlarma.map(x => x.codigoAlumno));
        });
      }

      container.querySelectorAll('[data-falta-aula]').forEach(btn => {
        btn.addEventListener('click', () => tutorAulaMarcarFalta(btn.dataset.faltaAula));
      });
      container.querySelectorAll('[data-ir-puerta]').forEach(btn => {
        btn.addEventListener('click', () => tutorAulaIndicarVanAPuerta(btn.dataset.irPuerta));
      });
      container.querySelectorAll('[data-terminar-aula]').forEach(btn => {
        btn.addEventListener('click', () => terminarProcesoSalida(btn.dataset.terminarAula));
      });

      if (!window.__aulaAutoRefreshTimer) {
        window.__aulaAutoRefreshTimer = setInterval(() => {
          if (currentUser && currentUser.perfil === 'TUTOR_AULA' && activeTab === 'aulaModule') {
            pullStateFromCloud(false);
            syncContinuousAlarmLoop();
          }
        }, 2000);
      }
      syncContinuousAlarmLoop();
    }

    function renderTablaProcesosPorSede(container) {
      const sedeCode = getActiveSedeCode();
      const sedeCfg = getSedeConfig(sedeCode);
      const procesosSede = appState.tbl_alumnos.filter(a => a.codigoSede === sedeCode);

      container.innerHTML = `
        <div class="space-y-6 fade-in">
          ${renderAdminSedeSelectorHtml()}

          <div class="bg-white rounded-2xl border border-slate-200 p-6 shadow-sm">
            <div class="flex flex-wrap items-center justify-between gap-2 mb-3">
              <div>
                <h2 class="text-base font-extrabold text-slate-900">Tabla de Procesos — ${sedeCfg.nombreSede}</h2>
                <p class="text-xs text-slate-500">Registro diario individual (${appState.fechaOperativa}) de <strong>${sedeCfg.nombreSede}</strong>.</p>
              </div>
              <span class="px-2.5 py-1 rounded-full text-xs font-bold bg-indigo-50 text-indigo-800">${procesosSede.length} alumno(s)</span>
            </div>

            <div class="overflow-x-auto border border-slate-200 rounded-xl">
              <table class="w-full text-left text-xs">
                <thead class="bg-slate-50 text-slate-600 font-bold border-b border-slate-200">
                  <tr>
                    <th class="px-3 py-2.5">Nombre Alumno</th>
                    <th class="px-3 py-2.5">Grado</th>
                    <th class="px-3 py-2.5">Aula</th>
                    <th class="px-3 py-2.5">Asistencia</th>
                    <th class="px-3 py-2.5">Estado del Proceso</th>
                    <th class="px-3 py-2.5">Hora Notif. Aula</th>
                    <th class="px-3 py-2.5">Va a Puerta</th>
                    <th class="px-3 py-2.5">Hora Fin</th>
                  </tr>
                </thead>
                <tbody class="divide-y divide-slate-100">
                  ${procesosSede.length ? procesosSede.map(p => `
                    <tr>
                      <td class="px-3 py-2.5 font-bold text-slate-900">${p.nombreAlumno}</td>
                      <td class="px-3 py-2.5 text-slate-700">${p.grado}</td>
                      <td class="px-3 py-2.5 font-semibold text-blue-800">${p.aula}</td>
                      <td class="px-3 py-2.5">${getAsistenciaBadge(p.asistencia)}</td>
                      <td class="px-3 py-2.5">${getEtapaBadge(p.etapaFlujo, p.alarmaActiva)}</td>
                      <td class="px-3 py-2.5 font-mono text-slate-600">${p.horaNotifAula}</td>
                      <td class="px-3 py-2.5 font-mono text-slate-600">${p.horaConfirmAula}</td>
                      <td class="px-3 py-2.5 font-mono text-slate-600">${p.horaFinProceso}</td>
                    </tr>
                  `).join('') : `
                    <tr>
                      <td colspan="8" class="px-4 py-8 text-center text-slate-400">No hay registros para esta sede.</td>
                    </tr>
                  `}
                </tbody>
              </table>
            </div>
          </div>
        </div>
      `;

      bindAdminSedeSelector(container);
    }

    // =========================================================================
    // 7. CONFIGURACIÓN DE HORARIOS (INICIAL, PRIMARIA Y ASIGNACIÓN A AULAS)
    // =========================================================================
    let selectedSedeHorarioEdit = SEDES_Y_GRADOS[0].codigoSede;

    function eliminarHorarioDeSede(codigoSede) {
      const hg = appState.horarioGlobal || buildDefaultHorarioGlobal();
      const s = getSedeConfig(codigoSede);
      if (!appState.horariosPorSede) {
        appState.horariosPorSede = buildDefaultHorariosPorSede(hg);
      }
      appState.horariosPorSede[codigoSede] = {
        codigoSede: s.codigoSede,
        nombreSede: s.nombreSede,
        horaInicioSalida: '—',
        horaFinSalida: '—',
        diasActivos: 'Sin horario asignado',
        actualizadoEn: getTodayISO()
      };
      saveState();
      updateHeaderBadges();
      syncTableEvent('DELETE_HORARIO_SEDE', { codigoSede });
      renderCurrentTab();
      showToast(`Horario eliminado para ${s.nombreSede}.`);
    }

    function renderHorarioGlobalAdmin(container) {
      const esTutorPuerta = currentUser && currentUser.perfil === 'TUTOR_PUERTA';
      const sedeActivaCode = esTutorPuerta ? currentUser.codigoSede : selectedSedeHorarioEdit;
      const sedeEdit = getSedeConfig(sedeActivaCode);

      if (!appState.horariosPorNivel) {
        appState.horariosPorNivel = buildDefaultHorariosPorNivel();
      }
      const hInicial = getHorarioDeNivel('Inicial');
      const hPrimaria = getHorarioDeNivel('Primaria');
      const aulasSede = getAulasPermanentesDeSede(sedeActivaCode);

      container.innerHTML = `
        <div class="space-y-6 fade-in">
          <!-- HORARIOS POR NIVEL: INICIAL (8:30 - 13:30) Y PRIMARIA (7:45 - 13:50) -->
          <div class="grid grid-cols-1 md:grid-cols-2 gap-5">
            <div class="bg-white rounded-2xl border border-slate-200 p-5 shadow-sm">
              <div class="flex items-center justify-between gap-2 mb-3">
                <div>
                  <h2 class="text-sm font-extrabold text-slate-900">Horario Nivel Inicial</h2>
                  <p class="text-xs text-slate-500">Por defecto: Ingreso <strong>08:30</strong> &bull; Salida <strong>13:30</strong></p>
                </div>
                <span class="px-2.5 py-1 rounded-full text-[11px] font-bold bg-amber-100 text-amber-900">Inicial</span>
              </div>
              <form id="horarioInicialForm" class="grid grid-cols-1 sm:grid-cols-3 gap-3">
                <div>
                  <label class="block text-[11px] font-bold text-slate-700 mb-1">Hora Ingreso</label>
                  <input id="inpIniIngreso" type="time" required value="${hInicial.horaIngreso}"
                    class="w-full px-3 py-2 rounded-xl border border-slate-300 text-xs font-mono" />
                </div>
                <div>
                  <label class="block text-[11px] font-bold text-slate-700 mb-1">Hora Salida</label>
                  <input id="inpIniSalida" type="time" required value="${hInicial.horaSalida}"
                    class="w-full px-3 py-2 rounded-xl border border-slate-300 text-xs font-mono" />
                </div>
                <div class="flex items-end">
                  <button type="submit" class="w-full py-2 px-3 rounded-xl bg-amber-600 hover:bg-amber-700 text-white text-xs font-bold shadow">
                    Guardar Inicial
                  </button>
                </div>
              </form>
            </div>

            <div class="bg-white rounded-2xl border border-slate-200 p-5 shadow-sm">
              <div class="flex items-center justify-between gap-2 mb-3">
                <div>
                  <h2 class="text-sm font-extrabold text-slate-900">Horario Nivel Primaria</h2>
                  <p class="text-xs text-slate-500">Por defecto: Ingreso <strong>07:45</strong> &bull; Salida <strong>13:50</strong></p>
                </div>
                <span class="px-2.5 py-1 rounded-full text-[11px] font-bold bg-blue-100 text-blue-900">Primaria</span>
              </div>
              <form id="horarioPrimariaForm" class="grid grid-cols-1 sm:grid-cols-3 gap-3">
                <div>
                  <label class="block text-[11px] font-bold text-slate-700 mb-1">Hora Ingreso</label>
                  <input id="inpPriIngreso" type="time" required value="${hPrimaria.horaIngreso}"
                    class="w-full px-3 py-2 rounded-xl border border-slate-300 text-xs font-mono" />
                </div>
                <div>
                  <label class="block text-[11px] font-bold text-slate-700 mb-1">Hora Salida</label>
                  <input id="inpPriSalida" type="time" required value="${hPrimaria.horaSalida}"
                    class="w-full px-3 py-2 rounded-xl border border-slate-300 text-xs font-mono" />
                </div>
                <div class="flex items-end">
                  <button type="submit" class="w-full py-2 px-3 rounded-xl bg-blue-700 hover:bg-blue-800 text-white text-xs font-bold shadow">
                    Guardar Primaria
                  </button>
                </div>
              </form>
            </div>
          </div>

          <!-- ASIGNACIÓN DE HORARIO A AULAS -->
          <div class="bg-white rounded-2xl border border-slate-200 p-6 shadow-sm">
            <div class="flex flex-wrap items-center justify-between gap-3 mb-4">
              <div>
                <h3 class="text-base font-extrabold text-slate-900">Asignar Horario a Aulas — ${sedeEdit.nombreSede}</h3>
                <p class="text-xs text-slate-500">Asigne el horario de Inicial, Primaria o un horario personalizado a cada aula y aplíquelo con un clic.</p>
              </div>
              ${!esTutorPuerta ? `
                <select id="selSedeAulasHorario"
                  class="px-3.5 py-2 rounded-xl border border-slate-300 bg-slate-50 text-xs font-bold text-slate-900">
                  ${SEDES_Y_GRADOS.map(s => `<option value="${s.codigoSede}" ${s.codigoSede === sedeActivaCode ? 'selected' : ''}>${s.nombreSede}</option>`).join('')}
                </select>
              ` : ''}
            </div>

            <form id="asignarHorarioAulaForm" class="grid grid-cols-1 sm:grid-cols-2 lg:grid-cols-5 gap-3 mb-5 p-4 rounded-xl bg-slate-50 border border-slate-200">
              <div>
                <label class="block text-[11px] font-bold text-slate-700 mb-1">Aula</label>
                <select id="selAulaAsignarHorario" class="w-full px-3 py-2 rounded-lg border border-slate-300 bg-white text-xs font-semibold">
                  ${aulasSede.length
                    ? aulasSede.map(a => `<option value="${a.idAula}">${a.nombreAula}${a.grado ? ` (${a.grado})` : ''}</option>`).join('')
                    : `<option value="">Sin aulas en sede</option>`}
                </select>
              </div>
              <div>
                <label class="block text-[11px] font-bold text-slate-700 mb-1">Plantilla / Nivel</label>
                <select id="selPlantillaHorarioAula" class="w-full px-3 py-2 rounded-lg border border-slate-300 bg-white text-xs font-semibold">
                  <option value="Inicial">Inicial (${hInicial.horaIngreso} - ${hInicial.horaSalida})</option>
                  <option value="Primaria">Primaria (${hPrimaria.horaIngreso} - ${hPrimaria.horaSalida})</option>
                  <option value="Personalizado">Personalizado</option>
                </select>
              </div>
              <div>
                <label class="block text-[11px] font-bold text-slate-700 mb-1">Hora Ingreso</label>
                <input id="inpAsigIngreso" type="time" required value="${hInicial.horaIngreso}"
                  class="w-full px-3 py-2 rounded-lg border border-slate-300 bg-white text-xs font-mono" />
              </div>
              <div>
                <label class="block text-[11px] font-bold text-slate-700 mb-1">Hora Salida</label>
                <input id="inpAsigSalida" type="time" required value="${hInicial.horaSalida}"
                  class="w-full px-3 py-2 rounded-lg border border-slate-300 bg-white text-xs font-mono" />
              </div>
              <div class="flex items-end">
                <button type="submit" class="w-full py-2 px-3 rounded-lg bg-indigo-700 hover:bg-indigo-800 text-white text-xs font-bold shadow">
                  Asignar a Aula
                </button>
              </div>
            </form>

            <div class="overflow-x-auto border border-slate-200 rounded-xl">
              <table class="w-full text-left text-xs">
                <thead class="bg-slate-50 text-slate-600 font-bold border-b border-slate-200">
                  <tr>
                    <th class="px-3 py-2.5">Aula</th>
                    <th class="px-3 py-2.5">Nivel</th>
                    <th class="px-3 py-2.5">Grado</th>
                    <th class="px-3 py-2.5">Ingreso</th>
                    <th class="px-3 py-2.5">Salida</th>
                    <th class="px-3 py-2.5">Origen</th>
                    <th class="px-3 py-2.5 text-right">Asignación Rápida</th>
                  </tr>
                </thead>
                <tbody class="divide-y divide-slate-100">
                  ${aulasSede.length ? aulasSede.map(au => {
                    const res = resolverHorarioAula(au, sedeActivaCode);
                    return `
                      <tr>
                        <td class="px-3 py-2.5 font-bold text-slate-900">${au.nombreAula}</td>
                        <td class="px-3 py-2.5 font-semibold text-indigo-800">${res.nivel}</td>
                        <td class="px-3 py-2.5 text-slate-700">${au.grado || '—'}</td>
                        <td class="px-3 py-2.5 font-mono font-bold text-emerald-800">${res.horaIngreso}</td>
                        <td class="px-3 py-2.5 font-mono font-bold text-emerald-800">${res.horaSalida}</td>
                        <td class="px-3 py-2.5 text-slate-500">${res.origen}</td>
                        <td class="px-3 py-2.5 text-right space-x-1.5 whitespace-nowrap">
                          <button type="button" data-quick-nivel-aula="${au.idAula}" data-nivel="Inicial"
                            class="px-2 py-1 rounded-lg bg-amber-100 hover:bg-amber-200 text-amber-900 font-bold text-[11px]">
                            Usar Inicial
                          </button>
                          <button type="button" data-quick-nivel-aula="${au.idAula}" data-nivel="Primaria"
                            class="px-2 py-1 rounded-lg bg-blue-100 hover:bg-blue-200 text-blue-900 font-bold text-[11px]">
                            Usar Primaria
                          </button>
                        </td>
                      </tr>
                    `;
                  }).join('') : `
                    <tr>
                      <td colspan="7" class="px-4 py-6 text-center text-slate-400">No hay aulas permanentes creadas en ${sedeEdit.nombreSede}.</td>
                    </tr>
                  `}
                </tbody>
              </table>
            </div>
          </div>
        </div>
      `;

      document.getElementById('horarioInicialForm').addEventListener('submit', e => {
        e.preventDefault();
        const ing = document.getElementById('inpIniIngreso').value;
        const sal = document.getElementById('inpIniSalida').value;
        appState.horariosPorNivel.Inicial = {
          nivel: 'Inicial',
          horaIngreso: ing,
          horaSalida: sal,
          diasActivos: 'Lunes a Viernes',
          actualizadoEn: getTodayISO()
        };
        saveState();
        updateHeaderBadges();
        syncTableEvent('UPDATE_HORARIO_NIVEL', { horarioNivel: appState.horariosPorNivel.Inicial });
        renderCurrentTab();
        showToast(`Horario de Inicial actualizado (${ing} - ${sal}).`);
      });

      document.getElementById('horarioPrimariaForm').addEventListener('submit', e => {
        e.preventDefault();
        const ing = document.getElementById('inpPriIngreso').value;
        const sal = document.getElementById('inpPriSalida').value;
        appState.horariosPorNivel.Primaria = {
          nivel: 'Primaria',
          horaIngreso: ing,
          horaSalida: sal,
          diasActivos: 'Lunes a Viernes',
          actualizadoEn: getTodayISO()
        };
        appState.horarioGlobal = {
          horaInicioSalida: ing,
          horaFinSalida: sal,
          diasActivos: 'Lunes a Viernes',
          actualizadoEn: getTodayISO()
        };
        saveState();
        updateHeaderBadges();
        syncTableEvent('UPDATE_HORARIO_NIVEL', { horarioNivel: appState.horariosPorNivel.Primaria });
        renderCurrentTab();
        showToast(`Horario de Primaria actualizado (${ing} - ${sal}).`);
      });

      const selSedeAulas = document.getElementById('selSedeAulasHorario');
      if (selSedeAulas) {
        selSedeAulas.addEventListener('change', e => {
          selectedSedeHorarioEdit = e.target.value;
          renderCurrentTab();
        });
      }

      const selPlantilla = document.getElementById('selPlantillaHorarioAula');
      const inpAsigIng = document.getElementById('inpAsigIngreso');
      const inpAsigSal = document.getElementById('inpAsigSalida');
      if (selPlantilla && inpAsigIng && inpAsigSal) {
        selPlantilla.addEventListener('change', () => {
          if (selPlantilla.value === 'Inicial') {
            inpAsigIng.value = hInicial.horaIngreso;
            inpAsigSal.value = hInicial.horaSalida;
          } else if (selPlantilla.value === 'Primaria') {
            inpAsigIng.value = hPrimaria.horaIngreso;
            inpAsigSal.value = hPrimaria.horaSalida;
          }
        });
      }

      document.getElementById('asignarHorarioAulaForm').addEventListener('submit', e => {
        e.preventDefault();
        const idAula = document.getElementById('selAulaAsignarHorario').value;
        const plantilla = document.getElementById('selPlantillaHorarioAula').value;
        const ing = document.getElementById('inpAsigIngreso').value;
        const sal = document.getElementById('inpAsigSalida').value;
        const aulaObj = appState.tbl_aulas_permanentes.find(a => a.idAula === idAula && a.codigoSede === sedeActivaCode);
        if (!aulaObj) {
          showToast('Seleccione un aula válida.');
          return;
        }
        aulaObj.nivel = plantilla === 'Inicial' ? 'Inicial' : (plantilla === 'Primaria' ? 'Primaria' : (aulaObj.nivel || getNivelDeGrado(aulaObj.grado)));
        aulaObj.horarioPersonalizado = {
          horaIngreso: ing,
          horaSalida: sal,
          diasActivos: 'Lunes a Viernes'
        };
        saveState();
        syncTableEvent('ASSIGN_HORARIO_AULA', { codigoSede: sedeActivaCode, aula: aulaObj });
        renderCurrentTab();
        showToast(`Horario ${ing} - ${sal} asignado a ${aulaObj.nombreAula}.`);
      });

      container.querySelectorAll('[data-quick-nivel-aula]').forEach(btn => {
        btn.addEventListener('click', () => {
          const idAula = btn.dataset.quickNivelAula;
          const nivelElegido = btn.dataset.nivel;
          const hn = getHorarioDeNivel(nivelElegido);
          const aulaObj = appState.tbl_aulas_permanentes.find(a => a.idAula === idAula && a.codigoSede === sedeActivaCode);
          if (!aulaObj) return;
          aulaObj.nivel = nivelElegido;
          aulaObj.horarioPersonalizado = {
            horaIngreso: hn.horaIngreso,
            horaSalida: hn.horaSalida,
            diasActivos: hn.diasActivos || 'Lunes a Viernes'
          };
          saveState();
          syncTableEvent('ASSIGN_HORARIO_AULA', { codigoSede: sedeActivaCode, aula: aulaObj });
          renderCurrentTab();
          showToast(`Horario de ${nivelElegido} (${hn.horaIngreso} - ${hn.horaSalida}) asignado a ${aulaObj.nombreAula}.`);
        });
      });
    }
  </script>
</body>
</html>
