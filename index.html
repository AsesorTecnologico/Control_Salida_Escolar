    function getTodayISO() {
      const now = new Date();
      const y = now.getFullYear();
      const m = String(now.getMonth() + 1).padStart(2, '0');
      const d = String(now.getDate()).padStart(2, '0');
      return `${y}-${m}-${d}`;
    }

    function getNextDayISO(isoDate) {
      const base = isoDate ? new Date(`${isoDate}T12:00:00`) : new Date();
      base.setDate(base.getDate() + 1);
      const y = base.getFullYear();
      const m = String(base.getMonth() + 1).padStart(2, '0');
      const d = String(base.getDate()).padStart(2, '0');
      return `${y}-${m}-${d}`;
    }

    }

    // =========================================================================
    // 2. SONIDO DE ALERTA PARA NOTIFICACIÓN AL TUTOR DE AULA
    // =========================================================================
    let audioCtxInstance = null;

    function playAlertSound() {
      try {
        const AudioCtx = window.AudioContext || window.webkitAudioContext;
        if (!AudioCtx) return;
        if (!audioCtxInstance) {
          audioCtxInstance = new AudioCtx();
        }
        if (audioCtxInstance.state === 'suspended') {
          audioCtxInstance.resume();
        }

        const now = audioCtxInstance.currentTime;
        const notes = [
          { freq: 880, start: 0, dur: 0.16 },
          { freq: 1174.66, start: 0.18, dur: 0.16 },
          { freq: 880, start: 0.36, dur: 0.22 }
        ];

        notes.forEach(n => {
          const osc = audioCtxInstance.createOscillator();
          const gain = audioCtxInstance.createGain();
          osc.type = 'triangle';
          osc.frequency.setValueAtTime(n.freq, now + n.start);

          gain.gain.setValueAtTime(0.001, now + n.start);
          gain.gain.exponentialRampToValueAtTime(0.25, now + n.start + 0.02);
          gain.gain.exponentialRampToValueAtTime(0.001, now + n.start + n.dur);

          osc.connect(gain);
          gain.connect(audioCtxInstance.destination);

          osc.start(now + n.start);
          osc.stop(now + n.start + n.dur + 0.02);
        });
      } catch (_) {}
    }

    // Siempre al día siguiente:
    // - Todos los alumnos se activan con estado PRESENTE
    // - Se conserva la lista de alumnos (nombreAlumno, grado, aula)
    // - Se reinician los estados de salida y registros diarios
    function migrarListaAlumnosParaSiguienteDia(stateObj, nuevaFecha) {
      const targetDate = nuevaFecha || getNextDayISO(stateObj.fechaOperativa);
      stateObj.tbl_alumnos = stateObj.tbl_alumnos.map(a => ({
        codigoAlumno: a.codigoAlumno,
        codigoSede: a.codigoSede,
        nombreSede: a.nombreSede,
        nombreAlumno: a.nombreAlumno,
        grado: a.grado,
        aula: a.aula,
        asistencia: ASISTENCIA.PRESENTE,
        etapaFlujo: FLOW_STEP.PENDIENTE,
        horaNotifAula: '—',
        horaConfirmAula: '—',
        horaFinProceso: '—',
        alertaVisualAula: false,
        fechaDia: targetDate
      }));
      stateObj.tbl_notificaciones_aula = [];
      stateObj.tbl_salidas_estudiantes = [];
      stateObj.fechaOperativa = targetDate;
    }

    function ensureDayRollover(stateObj) {
      const today = getTodayISO();
      if (!stateObj.fechaOperativa) {
        stateObj.fechaOperativa = today;
        return;
      }
      if (stateObj.fechaOperativa !== today && stateObj.fechaOperativa < today) {
        migrarListaAlumnosParaSiguienteDia(stateObj, today);
        saveState(stateObj);
      }
    }

    function loadState() {
      try {
        const raw = localStorage.getItem(STORAGE_KEY);
        if (!raw) return buildFreshTablesState();
        const parsed = JSON.parse(raw);
        if (!Array.isArray(parsed.tbl_alumnos) || !Array.isArray(parsed.accessProfiles)) {
          return buildFreshTablesState();
        }
        if (!Array.isArray(parsed.tbl_aulas_sede)) {
          parsed.tbl_aulas_sede = buildFreshTablesState().tbl_aulas_sede;
        }
        ensureDayRollover(parsed);
        return parsed;
      } catch (e) {
        return buildFreshTablesState();
      }
    }

    function saveState(st = appState) {
      localStorage.setItem(STORAGE_KEY, JSON.stringify(st));
    }

        await fetch(SHEETS_WEBHOOK_URL, {
          method: 'POST',
          mode: 'no-cors',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ action, ...payload })
        });
      } catch (_) {}
    }

    function migrarAlumnosSiguienteDiaManual() {
      const siguienteFecha = getNextDayISO(appState.fechaOperativa);
      migrarListaAlumnosParaSiguienteDia(appState, siguienteFecha);
      saveState(appState);
      updateHeaderDateBadge();
      syncTableEvent('MIGRAR_ALUMNOS_DIA', { nuevaFecha: siguienteFecha });
      if (currentUser) renderCurrentTab();
      showToast(`Lista migrada al día ${siguienteFecha}: todos los alumnos en estado PRESENTE.`);
    }

    function recreateAllTablesNow() {
      appState = buildFreshTablesState();
      saveState(appState);
      updateHeaderDateBadge();
      syncTableEvent('RECREATE_TABLES', { fechaOperativa: appState.fechaOperativa });
      if (currentUser) renderCurrentTab();
      showToast('Tablas creadas nuevamente para el registro diario.');
    }

    function updateHeaderDateBadge() {
      const el = document.getElementById('fechaOperativaBadge');
      if (el) el.textContent = `Día: ${appState.fechaOperativa}`;
    }

    let appState = loadState();
    let currentUser = null;
    let activeTab = '';
    let selectedSedeForAdmin = SEDES_Y_GRADOS[0].codigoSede;
    let editingAulaId = null;

    function getActiveSedeCode() {
      if (!currentUser) return SEDES_Y_GRADOS[0].codigoSede;
      return currentUser.perfil === 'ADMINISTRADOR' ? selectedSedeForAdmin : currentUser.codigoSede;
    }

    function getAulasDeSede(sedeCode) {
      const fromTable = appState.tbl_aulas_sede.filter(a => a.codigoSede === sedeCode);
      if (fromTable.length) return fromTable;
      const fromAlumnos = Array.from(new Set(appState.tbl_alumnos.filter(a => a.codigoSede === sedeCode).map(a => a.aula))).filter(Boolean);
      return fromAlumnos.map((nombreAula, idx) => ({
        idAula: `AUL-${sedeCode}-${idx + 1}`,
        codigoSede: sedeCode,
        nombreAula,
        grado: ''
      }));
    }

    // =========================================================================
    // 4. AUTENTICACIÓN POR SEDE Y PERFIL
    // =========================================================================
    document.getElementById('loginForm').addEventListener('submit', e => {
      e.preventDefault();
      const selectedSede = document.getElementById('loginSede').value;
      const u = document.getElementById('loginUser').value.trim().toLowerCase();
      const p = document.getElementById('loginPass').value;
      const errEl = document.getElementById('loginError');

      const acc = appState.accessProfiles.find(a => {
        if (a.estado !== 'ACTIVO') return false;
        if (a.usuario.toLowerCase() !== u || a.clave !== p) return false;
        if (a.perfil === 'ADMINISTRADOR') return selectedSede === 'TODAS' || selectedSede === a.codigoSede;
        return a.codigoSede === selectedSede;
      });

      if (!acc) {
        errEl.textContent = 'Credenciales o sede inválidas para el perfil seleccionado.';
        errEl.classList.remove('hidden');
        return;
      }
      errEl.classList.add('hidden');
      enterApp(acc);
    });

    document.getElementById('migrarDiaBtn').addEventListener('click', migrarAlumnosSiguienteDiaManual);
    document.getElementById('recreateTablesBtn').addEventListener('click', recreateAllTablesNow);

    document.getElementById('logoutBtn').addEventListener('click', () => {
      currentUser = null;
      editingAulaId = null;
      document.getElementById('appShell').classList.add('hidden');
      document.getElementById('loginScreen').classList.remove('hidden');
      document.getElementById('loginPass').value = '';
    });

    function enterApp(acc) {
      currentUser = acc;
      editingAulaId = null;
      ensureDayRollover(appState);
      updateHeaderDateBadge();

      document.getElementById('loginScreen').classList.add('hidden');
      document.getElementById('appShell').classList.remove('hidden');

      const roleTitles = {
        TUTOR_PUERTA: 'Tutor Puerta',
        TUTOR_AULA: 'Tutor Aula',
        ADMINISTRADOR: 'Administrador'
      };
      document.getElementById('roleBadge').textContent = roleTitles[acc.perfil] || acc.perfil;
      const sedeText = acc.codigoSede === 'TODAS' ? 'Todas las Sedes' : acc.nombreSede;
      document.getElementById('userContextLabel').textContent = `${acc.nombre} • ${sedeText}`;

      const tabs = getTabsForRole(acc.perfil);
      activeTab = tabs[0].id;
      renderTabs(tabs);
      renderCurrentTab();
    }

    function getTabsForRole(perfil) {
      if (perfil === 'TUTOR_PUERTA') {
        return [
          { id: 'tutorFlow', label: 'Flujo Puerta y Procesos (Sede)' },
          { id: 'cargaAlumnos', label: 'Carga de Alumnos y Aulas (Sede)' }
        ];
      }
      if (perfil === 'TUTOR_AULA') {
        return [
          { id: 'aulaModule', label: 'Módulo Tutor de Aula (Sede)' },
          { id: 'cargaAlumnos', label: 'Carga de Alumnos y Aulas (Sede)' }
        ];
      }
      return [
        { id: 'cargaAlumnos', label: 'Carga de Alumnos y Aulas (Por Sede)' },
        { id: 'processBySede', label: 'Tabla de Procesos (Por Sede)' }
      ];
    }

    function renderTabs(tabs) {
      const box = document.getElementById('navTabsContainer');
      box.innerHTML = tabs.map(t => `
        <button type="button" data-tab="${t.id}"
          class="px-4 py-3 text-xs font-bold border-b-2 transition whitespace-nowrap ${
            t.id === activeTab
              ? 'border-blue-400 text-white bg-slate-900/50'
              : 'border-transparent text-slate-300 hover:text-white hover:border-slate-500'
          }">${t.label}</button>
      `).join('');

      box.querySelectorAll('[data-tab]').forEach(btn => {
        btn.addEventListener('click', () => {
          activeTab = btn.dataset.tab;
          renderTabs(getTabsForRole(currentUser.perfil));
          renderCurrentTab();
        });
      });
    }

    function renderCurrentTab() {
      ensureDayRollover(appState);
      updateHeaderDateBadge();
      const container = document.getElementById('mainContent');
      if (activeTab === 'cargaAlumnos') return renderCargaAlumnosYAulasPorSede(container);
      if (activeTab === 'processBySede') return renderTablaProcesosPorSede(container);
      if (activeTab === 'tutorFlow') return renderTutorGateFlow(container);
      return renderTutorAulaModule(container);
    }

    function renderAdminSedeSelectorHtml() {
      if (currentUser.perfil !== 'ADMINISTRADOR') return '';
      return `
        <div class="bg-white rounded-2xl border border-slate-200 p-4 shadow-sm flex flex-wrap items-center justify-between gap-3">
          <div>
            <span class="text-[11px] font-extrabold uppercase tracking-wider text-slate-400 block">Selección Individual de Sede</span>
            <span class="text-xs text-slate-600">Mostrando información individual para <strong>${getSedeConfig(selectedSedeForAdmin).nombreSede}</strong></span>
          </div>
          <select id="adminSedePicker" class="px-3.5 py-2 rounded-xl border border-slate-300 bg-slate-50 text-xs font-bold text-slate-900">
            ${SEDES_Y_GRADOS.map(s => `<option value="${s.codigoSede}" ${s.codigoSede === selectedSedeForAdmin ? 'selected' : ''}>${s.nombreSede}</option>`).join('')}
          </select>
        </div>
      `;
    }

    function bindAdminSedeSelector(container) {
      const picker = container.querySelector('#adminSedePicker');
      if (!picker) return;
      picker.addEventListener('change', () => {
        selectedSedeForAdmin = picker.value;
        editingAulaId = null;
        renderCurrentTab();
      });
    }

    // =========================================================================
    // 5. AULAS POR SEDE (CREAR, EDITAR, ACTUALIZAR, ELIMINAR) +
    //    CARGA DE ALUMNOS POR SEDE (AGREGAR, MIGRAR, ELIMINAR)
    // =========================================================================
    function eliminarAlumnoSede(codigoAlumno) {
      const sedeCode = getActiveSedeCode();
      const idx = appState.tbl_alumnos.findIndex(a => a.codigoAlumno === codigoAlumno && a.codigoSede === sedeCode);
      if (idx === -1) return;
      const eliminado = appState.tbl_alumnos[idx];
      appState.tbl_alumnos.splice(idx, 1);
      saveState();
      syncTableEvent('DELETE_ALUMNO_SEDE', { codigoAlumno, codigoSede: sedeCode });
      renderCurrentTab();
      showToast(`Alumno "${eliminado.nombreAlumno}" eliminado de la lista.`);
    }

    function eliminarAulaSede(idAula) {
      const sedeCode = getActiveSedeCode();
      const idx = appState.tbl_aulas_sede.findIndex(a => a.idAula === idAula && a.codigoSede === sedeCode);
      if (idx === -1) return;
      const aulaEliminada = appState.tbl_aulas_sede[idx];
      appState.tbl_aulas_sede.splice(idx, 1);
      if (editingAulaId === idAula) editingAulaId = null;
      saveState();
      syncTableEvent('DELETE_AULA_SEDE', { idAula, codigoSede: sedeCode });
      renderCurrentTab();
      showToast(`Aula "${aulaEliminada.nombreAula}" eliminada en ${sedeCode}.`);
    }

      container.innerHTML = `

              </div>
            </form>

            <div class="flex flex-wrap gap-2">
              ${aulasSede.length ? aulasSede.map(au => `
                <div class="flex items-center gap-2 px-3 py-2 rounded-xl border border-slate-200 bg-white text-xs shadow-2xs">

                    Eliminar
                  </button>
                </div>
              `).join('') : `<p class="text-xs text-slate-400">No hay aulas creadas en esta sede.</p>`}
            </div>
          </div>

          <!-- CARGA Y LISTA DE ALUMNOS DE LA SEDE -->
          <div class="grid grid-cols-1 lg:grid-cols-3 gap-6">
            <div class="bg-white rounded-2xl border border-slate-200 p-6 shadow-sm h-fit">
              <div class="flex items-center justify-between gap-2 mb-1">
                <h2 class="text-base font-extrabold text-slate-900">Carga de Alumnos</h2>
                <span class="px-2.5 py-0.5 rounded-full text-[11px] font-bold bg-blue-100 text-blue-800">${sedeCfg.codigoSede}</span>
              </div>
              <p class="text-xs text-slate-500 mb-4">Día <strong>${appState.fechaOperativa}</strong> &bull; Se cargan como <strong>PRESENTE</strong>.</p>

              <form id="cargaAlumnoSedeForm" class="space-y-3.5">

                </div>

                <button type="submit" class="w-full py-2.5 rounded-xl bg-blue-700 hover:bg-blue-800 text-white text-xs font-bold shadow transition">
                  Agregar Alumno a ${sedeCfg.codigoSede}
                </button>
              </form>

              <div class="flex flex-wrap items-center justify-between gap-2 mb-3">
                <div>
                  <h3 class="text-base font-extrabold text-slate-900">Lista de Alumnos — ${sedeCfg.nombreSede}</h3>
                  <p class="text-xs text-slate-500">Esta lista puede migrar al día siguiente o eliminarse si es necesario.</p>
                </div>
                <span class="px-2.5 py-1 rounded-full text-xs font-bold bg-slate-100 text-slate-700">${alumnosSede.length} alumno(s)</span>
              </div>

              <div class="overflow-x-auto border border-slate-200 rounded-xl">
                <table class="w-full text-left text-xs">
                  <thead class="bg-slate-50 text-slate-600 font-bold border-b border-slate-200">
                    <tr>
                      <th class="px-4 py-2.5">Nombre Alumno</th>
                      <th class="px-4 py-2.5">Grado</th>
                      <th class="px-4 py-2.5">Aula</th>
                      <th class="px-4 py-2.5">Asistencia</th>
                      <th class="px-4 py-2.5 text-right">Eliminar</th>
                    </tr>
                  </thead>
                  <tbody class="divide-y divide-slate-100">
                    ${alumnosSede.length ? alumnosSede.map(a => `
                      <tr>
                        <td class="px-4 py-2.5 font-bold text-slate-900">${a.nombreAlumno}</td>
                        <td class="px-4 py-2.5 text-slate-700">${a.grado}</td>
                        <td class="px-4 py-2.5 font-semibold text-blue-800">${a.aula}</td>
                        <td class="px-4 py-2.5">${getAsistenciaBadge(a.asistencia)}</td>
                        <td class="px-4 py-2.5 text-right">
                          <button type="button" data-del-alumno="${a.codigoAlumno}"
                            class="px-2.5 py-1 rounded-lg bg-rose-100 hover:bg-rose-200 text-rose-800 font-bold text-[11px]">
                            Eliminar
                          </button>
                        </td>
                      </tr>
                    `).join('') : `
                      <tr>
                        <td colspan="5" class="px-4 py-8 text-center text-slate-400">No hay alumnos cargados en esta sede.</td>

      bindAdminSedeSelector(container);

      document.getElementById('aulaSedeForm').addEventListener('submit', e => {
        e.preventDefault();
        const nombreAula = document.getElementById('inpNombreAula').value.trim();
        const grado = document.getElementById('inpGradoAula').value;
        if (!nombreAula) return;

        if (editingAulaId) {
          const aulaObj = appState.tbl_aulas_sede.find(x => x.idAula === editingAulaId && x.codigoSede === sedeCode);
          if (aulaObj) {
            const anteriorNombre = aulaObj.nombreAula;
            aulaObj.nombreAula = nombreAula;
            aulaObj.grado = grado;
            appState.tbl_alumnos.forEach(al => {
              if (al.codigoSede === sedeCode && al.aula === anteriorNombre) {
                al.aula = nombreAula;
              }
            });
            syncTableEvent('UPDATE_AULA_SEDE', { aula: aulaObj });
            showToast(`Aula actualizada a "${nombreAula}".`);
          }
          editingAulaId = null;
        } else {
          const nuevaAula = {
            idAula: `AUL-${sedeCode}-${Date.now().toString().slice(-4)}`,
            codigoSede: sedeCode,
            nombreAula,
            grado
          };
          appState.tbl_aulas_sede.push(nuevaAula);
          syncTableEvent('CREATE_AULA_SEDE', { aula: nuevaAula });
          showToast(`Aula "${nombreAula}" creada en ${sedeCfg.nombreSede}.`);
        }

        saveState();
        renderCurrentTab();
      });

      const cancelBtn = document.getElementById('cancelEditAulaBtn');

        cancelBtn.addEventListener('click', () => {
          editingAulaId = null;
          renderCurrentTab();
        });

        const codigoAlumno = `ALU-${sedeCode}-${Date.now().toString().slice(-4)}`;
        const nuevoAlumno = {
          codigoAlumno,
          codigoSede: sedeCode,
          nombreSede: sedeCfg.nombreSede,
          nombreAlumno,
          grado,
          aula,
          asistencia: ASISTENCIA.PRESENTE,
          etapaFlujo: FLOW_STEP.PENDIENTE,
          horaNotifAula: '—',
          horaConfirmAula: '—',
          horaFinProceso: '—',
          alertaVisualAula: false,
          fechaDia: appState.fechaOperativa
        };

        appState.tbl_alumnos.push(nuevoAlumno);
        saveState();
        syncTableEvent('ADD_ALUMNO_SEDE', { alumno: nuevoAlumno });
        renderCurrentTab();
        showToast(`Alumno "${nombreAlumno}" agregado como PRESENTE en ${aula}.`);
      });
    }

    // =========================================================================
    // 6. FLUJO: TUTOR PUERTA NOTIFICA (CON SONIDO Y ALERTA VISUAL EN AULA) ->
    //    TUTOR AULA CONFIRMA O MARCA FALTA -> TERMINA PROCESO
    // =========================================================================
    function getAsistenciaBadge(asistencia) {
      if (asistencia === ASISTENCIA.FALTA) {
        return `<span class="px-2 py-0.5 rounded-full text-[10px] font-bold bg-rose-100 text-rose-800">FALTA</span>`;
      }
      return `<span class="px-2 py-0.5 rounded-full text-[10px] font-bold bg-emerald-100 text-emerald-800">PRESENTE</span>`;
    }

    function getEtapaBadge(etapa) {
      if (etapa === FLOW_STEP.FINALIZADO) {
        return `<span class="px-2 py-0.5 rounded-full text-[10px] font-bold bg-emerald-100 text-emerald-800">PROCESO TERMINADO</span>`;
      }
      if (etapa === FLOW_STEP.CONFIRMADO_AULA) {
        return `<span class="px-2 py-0.5 rounded-full text-[10px] font-bold bg-indigo-100 text-indigo-800">CONFIRMADO POR AULA (A PUERTA)</span>`;
      }
      if (etapa === FLOW_STEP.NOTIFICADO_AULA) {
        return `<span class="px-2 py-0.5 rounded-full text-[10px] font-bold bg-rose-100 text-rose-800">ALERTA: NOTIFICADO A AULA</span>`;
      }
      return `<span class="px-2 py-0.5 rounded-full text-[10px] font-bold bg-slate-100 text-slate-700">PENDIENTE</span>`;
    }

    // Tutor de puerta notifica al tutor de aula (activa alerta visual + sonido de alerta)
    function tutorPuertaNotificarAula(codigoAlumno) {
      const st = appState.tbl_alumnos.find(a => a.codigoAlumno === codigoAlumno && a.codigoSede === currentUser.codigoSede);
      if (!st) return;

      if (st.asistencia === ASISTENCIA.FALTA) {
        showToast(`El alumno ${st.nombreAlumno} figura con FALTA el día de hoy.`);
        return;
      }

      const hora = getNowHHMM();
      st.etapaFlujo = FLOW_STEP.NOTIFICADO_AULA;
      st.horaNotifAula = hora;
      st.alertaVisualAula = true;
      st.fechaDia = appState.fechaOperativa;

      appState.tbl_notificaciones_aula.unshift({
        fecha: appState.fechaOperativa,
        horaNotificacion: hora,
        codigoSede: st.codigoSede,
        nombreAlumno: st.nombreAlumno,
        grado: st.grado,
        aula: st.aula,
        tutorPuerta: currentUser.nombre,
        estado: 'NOTIFICADO_A_AULA'
      });

      saveState();
      playAlertSound();
      syncTableEvent('NOTIFICAR_TUTOR_AULA', { codigoAlumno, horaNotifAula: hora, fecha: appState.fechaOperativa });
      renderCurrentTab();
      showToast(`Alerta sonora y visual enviada al Tutor de Aula: ${st.nombreAlumno} (${st.aula}).`);
    }

    // Tutor de aula puede marcar falta si el alumno faltó el día de hoy
    function tutorAulaMarcarFalta(codigoAlumno) {
      const st = appState.tbl_alumnos.find(a => a.codigoAlumno === codigoAlumno && a.codigoSede === currentUser.codigoSede);
      if (!st) return;

      st.asistencia = st.asistencia === ASISTENCIA.FALTA ? ASISTENCIA.PRESENTE : ASISTENCIA.FALTA;
      if (st.asistencia === ASISTENCIA.FALTA) {
        st.alertaVisualAula = false;
        st.etapaFlujo = FLOW_STEP.PENDIENTE;
      }

      saveState();
      syncTableEvent('TOGGLE_FALTA_AULA', { codigoAlumno, asistencia: st.asistencia, fecha: appState.fechaOperativa });
      renderCurrentTab();
      showToast(`${st.nombreAlumno} marcado como ${st.asistencia}.`);
    }

    // Tutor de aula confirma que el alumno se dirige a la puerta
    function tutorAulaConfirmarAlumnoAPuerta(codigoAlumno) {
      const st = appState.tbl_alumnos.find(a => a.codigoAlumno === codigoAlumno && a.codigoSede === currentUser.codigoSede);
      if (!st) return;

      const hora = getNowHHMM();
      st.etapaFlujo = FLOW_STEP.CONFIRMADO_AULA;
      st.horaConfirmAula = hora;
      st.alertaVisualAula = false;

      saveState();
      syncTableEvent('CONFIRMAR_ALUMNO_A_PUERTA', { codigoAlumno, horaConfirmAula: hora, fecha: appState.fechaOperativa });
      renderCurrentTab();
      showToast(`Tutor de aula confirmó que ${st.nombreAlumno} se dirige a la puerta.`);
    }

    // Termina el proceso
    function terminarProcesoSalida(codigoAlumno) {
      const st = appState.tbl_alumnos.find(a => a.codigoAlumno === codigoAlumno && a.codigoSede === currentUser.codigoSede);
      if (!st) return;

      const hora = getNowHHMM();
      st.etapaFlujo = FLOW_STEP.FINALIZADO;
      st.horaFinProceso = hora;
      st.alertaVisualAula = false;

      appState.tbl_salidas_estudiantes.unshift({
        fecha: appState.fechaOperativa,
        horaFinProceso: hora,
        codigoSede: st.codigoSede,
        nombreAlumno: st.nombreAlumno,
        grado: st.grado,
        aula: st.aula,
        horaNotifAula: st.horaNotifAula,
        horaConfirmAula: st.horaConfirmAula,
        estado: 'PROCESO_TERMINADO'
      });

      saveState();
      syncTableEvent('TERMINAR_PROCESO', { codigoAlumno, horaFinProceso: hora, fecha: appState.fechaOperativa });
      renderCurrentTab();
      showToast(`Proceso terminado para ${st.nombreAlumno}.`);
    }

    function renderTutorGateFlow(container) {
      const sedeCode = currentUser.codigoSede;
      const sedeCfg = getSedeConfig(sedeCode);
      const alumnosSede = appState.tbl_alumnos.filter(a => a.codigoSede === sedeCode);

      container.innerHTML = `
        <div class="space-y-6 fade-in">
          <div class="bg-white rounded-2xl border border-slate-200 p-5 shadow-sm">
            <h2 class="text-sm font-extrabold text-slate-900 mb-1">Tabla de Procesos Individual — ${sedeCfg.nombreSede} (${appState.fechaOperativa})</h2>
            <p class="text-xs text-slate-500 mb-4">Al notificar a aula se emite un sonido de alerta y se activa la notificación visual para el Tutor de Aula.</p>

            <div class="overflow-x-auto border border-slate-200 rounded-xl">
              <table class="w-full text-left text-xs">
                <thead class="bg-slate-50 text-slate-600 font-bold border-b border-slate-200">
                  <tr>
                    <th class="px-3 py-2.5">Nombre Alumno</th>
                    <th class="px-3 py-2.5">Grado</th>
                    <th class="px-3 py-2.5">Aula</th>
                    <th class="px-3 py-2.5">Asistencia</th>
                    <th class="px-3 py-2.5">Estado</th>
                    <th class="px-3 py-2.5">Notif. Aula</th>
                    <th class="px-3 py-2.5">Conf. Aula</th>
                    <th class="px-3 py-2.5">Fin</th>
                    <th class="px-3 py-2.5 text-right">Acciones</th>
                  </tr>
                </thead>
                <tbody class="divide-y divide-slate-100">
                  ${alumnosSede.map(a => `
                    <tr>
                      <td class="px-3 py-2.5 font-bold text-slate-900">${a.nombreAlumno}</td>
                      <td class="px-3 py-2.5 text-slate-700">${a.grado}</td>
                      <td class="px-3 py-2.5 font-semibold text-blue-800">${a.aula}</td>
                      <td class="px-3 py-2.5">${getAsistenciaBadge(a.asistencia)}</td>
                      <td class="px-3 py-2.5">${getEtapaBadge(a.etapaFlujo)}</td>
                      <td class="px-3 py-2.5 font-mono text-slate-600">${a.horaNotifAula}</td>
                      <td class="px-3 py-2.5 font-mono text-slate-600">${a.horaConfirmAula}</td>
                      <td class="px-3 py-2.5 font-mono text-slate-600">${a.horaFinProceso}</td>
                      <td class="px-3 py-2.5 text-right space-x-1.5 whitespace-nowrap">
                        <button type="button" data-notificar-aula="${a.codigoAlumno}"
                          class="px-2.5 py-1 rounded-lg bg-blue-700 hover:bg-blue-800 text-white font-bold text-[11px]">
                          Notificar a Aula
                        </button>
                        ${a.etapaFlujo === FLOW_STEP.CONFIRMADO_AULA ? `
                          <button type="button" data-terminar="${a.codigoAlumno}"
                            class="px-2.5 py-1 rounded-lg bg-emerald-600 hover:bg-emerald-700 text-white font-bold text-[11px]">
                            Terminar Proceso
                          </button>
                        ` : ''}
                      </td>
                    </tr>
                  `).join('')}
                </tbody>
              </table>
            </div>
          </div>
        </div>
      `;

      container.querySelectorAll('[data-notificar-aula]').forEach(btn => {
        btn.addEventListener('click', () => tutorPuertaNotificarAula(btn.dataset.notificarAula));
      });
      container.querySelectorAll('[data-terminar]').forEach(btn => {
        btn.addEventListener('click', () => terminarProcesoSalida(btn.dataset.terminar));
      });
    }

    function renderTutorAulaModule(container) {
      const sedeCode = currentUser.codigoSede;
      const sedeCfg = getSedeConfig(sedeCode);
      const alumnosSede = appState.tbl_alumnos.filter(a => a.codigoSede === sedeCode);
      const alertasActivas = alumnosSede.filter(a => a.alertaVisualAula && a.etapaFlujo === FLOW_STEP.NOTIFICADO_AULA);

      if (alertasActivas.length > 0) {
        playAlertSound();
      }

      container.innerHTML = `
        <div class="space-y-6 fade-in">
          ${alertasActivas.length ? `
            <div class="p-4 rounded-2xl bg-rose-50 border-2 border-rose-500 text-rose-950 alert-pulse flex flex-wrap items-center justify-between gap-3">
              <div>
                <p class="text-xs font-extrabold uppercase tracking-wider text-rose-700">Alerta de Notificación desde Puerta</p>
                <p class="text-xs font-semibold mt-0.5">
                  ${alertasActivas.map(x => `${x.nombreAlumno} (${x.grado} — ${x.aula})`).join(' • ')}
                </p>
              </div>
              <button id="replayAlertSoundBtn" type="button"
                class="px-3 py-1.5 rounded-lg bg-rose-700 hover:bg-rose-800 text-white text-xs font-bold shadow">
                Reproducir Sonido de Alerta
              </button>
            </div>
          ` : ''}

          <div class="bg-white rounded-2xl border border-slate-200 p-5 shadow-sm">
            <h2 class="text-base font-extrabold text-slate-900 mb-1">Módulo Tutor de Aula — ${sedeCfg.nombreSede} (${appState.fechaOperativa})</h2>
            <p class="text-xs text-slate-500 mb-4">Todos inician como <strong>PRESENTE</strong> cada día. Puede indicar <strong>FALTA</strong>, confirmar que el alumno va a puerta o terminar el proceso.</p>

            <div class="overflow-x-auto border border-slate-200 rounded-xl">
              <table class="w-full text-left text-xs">
                <thead class="bg-slate-50 text-slate-600 font-bold border-b border-slate-200">
                  <tr>
                    <th class="px-3 py-2.5">Nombre Alumno</th>
                    <th class="px-3 py-2.5">Grado</th>
                    <th class="px-3 py-2.5">Aula</th>
                    <th class="px-3 py-2.5">Asistencia</th>
                    <th class="px-3 py-2.5">Estado</th>
                    <th class="px-3 py-2.5">Hora Notif.</th>
                    <th class="px-3 py-2.5">Hora Conf.</th>
                    <th class="px-3 py-2.5 text-right">Acciones de Aula</th>
                  </tr>
                </thead>
                <tbody class="divide-y divide-slate-100">
                  ${alumnosSede.map(a => `
                    <tr class="${a.alertaVisualAula ? 'bg-rose-50/70' : ''}">
                      <td class="px-3 py-2.5 font-bold text-slate-900">${a.nombreAlumno}</td>
                      <td class="px-3 py-2.5 text-slate-700">${a.grado}</td>
                      <td class="px-3 py-2.5 font-semibold text-blue-800">${a.aula}</td>
                      <td class="px-3 py-2.5">${getAsistenciaBadge(a.asistencia)}</td>
                      <td class="px-3 py-2.5">${getEtapaBadge(a.etapaFlujo)}</td>
                      <td class="px-3 py-2.5 font-mono text-slate-600">${a.horaNotifAula}</td>
                      <td class="px-3 py-2.5 font-mono text-slate-600">${a.horaConfirmAula}</td>
                      <td class="px-3 py-2.5 text-right space-x-1.5 whitespace-nowrap">
                        <button type="button" data-falta-aula="${a.codigoAlumno}"
                          class="px-2.5 py-1 rounded-lg ${a.asistencia === ASISTENCIA.FALTA ? 'bg-emerald-100 text-emerald-900' : 'bg-rose-100 text-rose-800'} font-bold text-[11px]">
                          ${a.asistencia === ASISTENCIA.FALTA ? 'Marcar Presente' : 'Indicar Falta'}
                        </button>
                        ${a.asistencia === ASISTENCIA.PRESENTE && a.etapaFlujo === FLOW_STEP.NOTIFICADO_AULA ? `
                          <button type="button" data-confirmar-puerta="${a.codigoAlumno}"
                            class="px-2.5 py-1 rounded-lg bg-indigo-600 hover:bg-indigo-700 text-white font-bold text-[11px]">
                            Confirmar Alumno a Puerta
                          </button>
                        ` : ''}
                        ${a.asistencia === ASISTENCIA.PRESENTE && a.etapaFlujo === FLOW_STEP.CONFIRMADO_AULA ? `
                          <button type="button" data-terminar-aula="${a.codigoAlumno}"
                            class="px-2.5 py-1 rounded-lg bg-emerald-600 hover:bg-emerald-700 text-white font-bold text-[11px]">
                            Terminar Proceso
                          </button>
                        ` : ''}
                        ${a.etapaFlujo === FLOW_STEP.FINALIZADO ? `
                          <span class="text-[11px] font-mono text-emerald-700 font-bold">Fin ${a.horaFinProceso}</span>
                        ` : ''}
                      </td>
                    </tr>
                  `).join('')}
                </tbody>
              </table>
            </div>
          </div>
        </div>
      `;

      const replayBtn = document.getElementById('replayAlertSoundBtn');
      if (replayBtn) {
        replayBtn.addEventListener('click', playAlertSound);
      }

      container.querySelectorAll('[data-falta-aula]').forEach(btn => {
        btn.addEventListener('click', () => tutorAulaMarcarFalta(btn.dataset.faltaAula));
      });
      container.querySelectorAll('[data-confirmar-puerta]').forEach(btn => {
        btn.addEventListener('click', () => tutorAulaConfirmarAlumnoAPuerta(btn.dataset.confirmarPuerta));
      });
      container.querySelectorAll('[data-terminar-aula]').forEach(btn => {
        btn.addEventListener('click', () => terminarProcesoSalida(btn.dataset.terminarAula));
      });
    }

    function renderTablaProcesosPorSede(container) {
      const sedeCode = getActiveSedeCode();
      const sedeCfg = getSedeConfig(sedeCode);
      const procesosSede = appState.tbl_alumnos.filter(a => a.codigoSede === sedeCode);

      container.innerHTML = `
        <div class="space-y-6 fade-in">
          ${renderAdminSedeSelectorHtml()}

          <div class="bg-white rounded-2xl border border-slate-200 p-6 shadow-sm">
            <div class="flex flex-wrap items-center justify-between gap-2 mb-3">
              <div>
                <h2 class="text-base font-extrabold text-slate-900">Tabla de Procesos — ${sedeCfg.nombreSede}</h2>
                <p class="text-xs text-slate-500">Registro diario individual (${appState.fechaOperativa}) de <strong>${sedeCfg.nombreSede}</strong>.</p>
              </div>
              <span class="px-2.5 py-1 rounded-full text-xs font-bold bg-indigo-50 text-indigo-800">${procesosSede.length} alumno(s)</span>
            </div>

            <div class="overflow-x-auto border border-slate-200 rounded-xl">
              <table class="w-full text-left text-xs">
                <thead class="bg-slate-50 text-slate-600 font-bold border-b border-slate-200">
                  <tr>
                    <th class="px-3 py-2.5">Nombre Alumno</th>
                    <th class="px-3 py-2.5">Grado</th>
                    <th class="px-3 py-2.5">Aula</th>
                    <th class="px-3 py-2.5">Asistencia</th>
                    <th class="px-3 py-2.5">Estado del Proceso</th>
                    <th class="px-3 py-2.5">Hora Notif. Aula</th>
                    <th class="px-3 py-2.5">Hora Conf. Aula</th>
                    <th class="px-3 py-2.5">Hora Fin</th>
                  </tr>
                </thead>
                <tbody class="divide-y divide-slate-100">
                  ${procesosSede.length ? procesosSede.map(p => `
                    <tr>
                      <td class="px-3 py-2.5 font-bold text-slate-900">${p.nombreAlumno}</td>
                      <td class="px-3 py-2.5 text-slate-700">${p.grado}</td>
                      <td class="px-3 py-2.5 font-semibold text-blue-800">${p.aula}</td>
                      <td class="px-3 py-2.5">${getAsistenciaBadge(p.asistencia)}</td>
                      <td class="px-3 py-2.5">${getEtapaBadge(p.etapaFlujo)}</td>
                      <td class="px-3 py-2.5 font-mono text-slate-600">${p.horaNotifAula}</td>
                      <td class="px-3 py-2.5 font-mono text-slate-600">${p.horaConfirmAula}</td>
                      <td class="px-3 py-2.5 font-mono text-slate-600">${p.horaFinProceso}</td>
                    </tr>
                  `).join('') : `
                    <tr>
                      <td colspan="8" class="px-4 py-8 text-center text-slate-400">No hay registros para esta sede.</td>
                    </tr>
                  `}
                </tbody>
              </table>
            </div>
          </div>
        </div>
      `;

      bindAdminSedeSelector(container);
    }
  </script>
</body>
</html>
