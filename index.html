<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>AulaSalida Smart — Flujo de Salida Escolar y Movilidad</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <style>
    body { font-family: Inter, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; }
    .fade-in { animation: fadeIn 0.2s ease-in-out; }
    @keyframes fadeIn { from { opacity: 0; transform: translateY(4px); } to { opacity: 1; transform: translateY(0); } }
  </style>
</head>
<body class="bg-slate-100 text-slate-900 min-h-screen">

  <!-- INICIO DE SESIÓN -->
  <div id="loginScreen" class="min-h-screen flex items-center justify-center p-4 bg-gradient-to-br from-slate-900 via-blue-950 to-slate-900">
    <div class="w-full max-w-md bg-white rounded-2xl shadow-2xl border border-slate-200 p-7 fade-in">
      <div class="flex items-center gap-3 mb-6">
        <div class="w-11 h-11 rounded-xl bg-blue-700 text-white flex items-center justify-center font-extrabold text-lg shadow">AS</div>
        <div>
          <h1 class="text-xl font-extrabold text-slate-900 leading-tight">AulaSalida Smart</h1>
          <p class="text-xs text-slate-500">Acceso por Sede y Perfil</p>
        </div>
      </div>

      <form id="loginForm" class="space-y-4">
        <div>
          <label class="block text-xs font-bold text-slate-700 mb-1">Sede</label>
          <select id="loginSede"
            class="w-full px-3.5 py-2.5 rounded-xl border border-slate-300 bg-white text-sm font-semibold focus:outline-none focus:ring-2 focus:ring-blue-600"></select>
        </div>
        <div>
          <label class="block text-xs font-bold text-slate-700 mb-1">Usuario</label>
          <input id="loginUser" type="text" required autocomplete="username"
            class="w-full px-3.5 py-2.5 rounded-xl border border-slate-300 text-sm focus:outline-none focus:ring-2 focus:ring-blue-600" />
        </div>
        <div>
          <label class="block text-xs font-bold text-slate-700 mb-1">Contraseña</label>
          <input id="loginPass" type="password" required autocomplete="current-password"
            class="w-full px-3.5 py-2.5 rounded-xl border border-slate-300 text-sm focus:outline-none focus:ring-2 focus:ring-blue-600" />
        </div>
        <p id="loginError" class="text-xs font-semibold text-rose-600 hidden"></p>
        <button type="submit" class="w-full py-2.5 rounded-xl bg-blue-700 hover:bg-blue-800 text-white font-bold text-sm shadow transition">
          Ingresar al Sistema
        </button>
      </form>
    </div>
  </div>

  <!-- SHELL PRINCIPAL -->
  <div id="appShell" class="hidden min-h-screen flex flex-col">
    <header class="bg-slate-900 text-white border-b border-slate-800 sticky top-0 z-30">
      <div class="max-w-7xl mx-auto px-4 py-3 flex flex-wrap items-center justify-between gap-3">
        <div class="flex items-center gap-3">
          <div class="w-9 h-9 rounded-lg bg-blue-600 flex items-center justify-center font-extrabold text-sm">AS</div>
          <div>
            <div class="flex items-center gap-2">
              <span class="font-extrabold text-sm tracking-tight">AulaSalida Smart</span>
              <span id="roleBadge" class="px-2 py-0.5 rounded-full text-[10px] font-bold bg-blue-500/20 text-blue-200 border border-blue-400/30"></span>
            </div>
            <p id="userContextLabel" class="text-[11px] text-slate-300"></p>
          </div>
        </div>

        <div class="flex items-center gap-2">
          <button id="recreateTablesBtn" type="button"
            class="px-3 py-1.5 rounded-lg bg-indigo-600 hover:bg-indigo-700 text-white text-xs font-bold transition shadow">
            Crear Tablas Nuevamente
          </button>
          <button id="logoutBtn" type="button" class="px-3 py-1.5 rounded-lg bg-rose-600 hover:bg-rose-700 text-white text-xs font-bold transition">
            Cerrar sesión
          </button>
        </div>
      </div>

      <nav id="topNav" class="bg-slate-800/90 border-t border-slate-700/70">
        <div id="navTabsContainer" class="max-w-7xl mx-auto px-4 flex items-center gap-1 overflow-x-auto"></div>
      </nav>
    </header>

    <main id="mainContent" class="flex-1 max-w-7xl w-full mx-auto px-4 py-6"></main>
  </div>

  <div id="toastBox" class="fixed bottom-5 right-5 z-50 hidden max-w-sm px-4 py-3 rounded-xl bg-slate-900 text-white text-xs font-semibold shadow-xl border border-slate-700"></div>

    const SEDE_MAP = Object.fromEntries(SEDES_Y_GRADOS.map(s => [s.codigoSede, s]));

    function getSedeConfig(code) {
      return SEDE_MAP[code] || SEDES_Y_GRADOS[0];
    }

    function buildAccessProfilesForSedes() {
      const profiles = [];

      // Perfil Administrador confirmado del sistema
      profiles.push({
        codigoPerfil: 'PERF-ADMIN',
        usuario: 'admin.general',
        clave: 'Admin2026!',
        perfil: 'ADMINISTRADOR',
        nombre: 'Administrador General del Sistema',
        codigoSede: 'TODAS',
        nombreSede: 'Todas las Sedes',
        estado: 'ACTIVO'
      });

      // Perfiles por sede: Tutor Puerta y Tutor Aula
      SEDES_Y_GRADOS.forEach(s => {
        const slug = s.codigoSede.toLowerCase();
        profiles.push({
          codigoPerfil: `PERF-${s.codigoSede}-PUERTA`,
          usuario: `puerta.${slug}`,
          clave: `Puerta${s.codigoSede}!`,
          perfil: 'TUTOR_PUERTA',
          nombre: `Tutor Puerta — ${s.nombreSede}`,
          codigoSede: s.codigoSede,
          nombreSede: s.nombreSede,
          estado: 'ACTIVO'
        });
        profiles.push({
          codigoPerfil: `PERF-${s.codigoSede}-AULA`,
          usuario: `aula.${slug}`,
          clave: `Aula${s.codigoSede}!`,
          perfil: 'TUTOR_AULA',
          nombre: `Tutor Aula — ${s.nombreSede}`,
          codigoSede: s.codigoSede,
          nombreSede: s.nombreSede,
          estado: 'ACTIVO'
        });
      });

      return profiles;
    }

    (function populateLoginSedeSelect() {
      const sel = document.getElementById('loginSede');
      sel.innerHTML =
        `<option value="TODAS">Todas las Sedes (Perfil Administrador)</option>` +
        SEDES_Y_GRADOS.map(s => `<option value="${s.codigoSede}">${s.nombreSede}</option>`).join('');
    })();

    function getTodayISO() {
      const now = new Date();
      const y = now.getFullYear();
      const m = String(now.getMonth() + 1).padStart(2, '0');
      const d = String(now.getDate()).padStart(2, '0');
      return `${y}-${m}-${d}`;
    }

    function getNowHHMM() {
      return new Date().toLocaleTimeString('es-PE', { hour: '2-digit', minute: '2-digit', hour12: false });
    }

    function showToast(msg) {
      const box = document.getElementById('toastBox');
      box.textContent = msg;
      box.classList.remove('hidden');
      clearTimeout(window.__toastTimer);
      window.__toastTimer = setTimeout(() => box.classList.add('hidden'), 3600);
    }

    // =========================================================================
    // 2. CREACIÓN / RECREACIÓN DE TABLAS Y CAMBIO DE DÍA
    // =========================================================================
    function buildFreshTablesState() {
      const today = getTodayISO();
      const accessProfiles = buildAccessProfilesForSedes();

      const tbl_perfiles_acceso = accessProfiles.map(p => ({
        codigoPerfil: p.codigoPerfil,
        usuario: p.usuario,
        perfil: p.perfil,
        nombre: p.nombre,
        codigoSede: p.codigoSede,
        nombreSede: p.nombreSede,
        estado: p.estado
      }));

      const tbl_sedes_niveles = SEDES_Y_GRADOS.map(s => ({
        codigoSede: s.codigoSede,
        nombreSede: s.nombreSede,
        hojaSede: s.sheetTab,
        nivelesDisponibles: s.niveles.join(' y '),
        gradosDisponibles: s.grados.join(' | ')
      }));

      const tbl_alumnos = [
        { codigoAlumno: 'ALU-101', codigoSede: 'S01', nombreSede: 'S01 - CAJAMARCA', nombreAlumno: 'Mateo Quispe Ramos', nivel: 'Primaria', gradoSeccion: '3° Grado A', tutorAula: 'Tutor Aula — S01 - CAJAMARCA', etapaFlujo: FLOW_STEP.INICIO, procesoOrigen: '—', detalleOrigen: '—', horaAccion1: '—', horaAccion2: '—', horaSalidaAula: '—', fechaDia: today },
        { codigoAlumno: 'ALU-102', codigoSede: 'S01', nombreSede: 'S01 - CAJAMARCA', nombreAlumno: 'Sofía Mendoza Díaz', nivel: 'Primaria', gradoSeccion: '3° Grado A', tutorAula: 'Tutor Aula — S01 - CAJAMARCA', etapaFlujo: FLOW_STEP.INICIO, procesoOrigen: '—', detalleOrigen: '—', horaAccion1: '—', horaAccion2: '—', horaSalidaAula: '—', fechaDia: today },
        { codigoAlumno: 'ALU-103', codigoSede: 'S01', nombreSede: 'S01 - CAJAMARCA', nombreAlumno: 'Liam Huamán Castro', nivel: 'Primaria', gradoSeccion: '4° Grado B', tutorAula: 'Tutor Aula — S01 - CAJAMARCA', etapaFlujo: FLOW_STEP.INICIO, procesoOrigen: '—', detalleOrigen: '—', horaAccion1: '—', horaAccion2: '—', horaSalidaAula: '—', fechaDia: today },
        { codigoAlumno: 'ALU-104', codigoSede: 'S01', nombreSede: 'S01 - CAJAMARCA', nombreAlumno: 'Valeria Salazar Ríos', nivel: 'Inicial', gradoSeccion: 'Inicial 5 Años', tutorAula: 'Tutor Aula — S01 - CAJAMARCA', etapaFlujo: FLOW_STEP.INICIO, procesoOrigen: '—', detalleOrigen: '—', horaAccion1: '—', horaAccion2: '—', horaSalidaAula: '—', fechaDia: today },
        { codigoAlumno: 'ALU-201', codigoSede: 'S02', nombreSede: 'S02 - CAMPOY', nombreAlumno: 'Gabriel Herrera Luna', nivel: 'Primaria', gradoSeccion: '2° Grado A', tutorAula: 'Tutor Aula — S02 - CAMPOY', etapaFlujo: FLOW_STEP.INICIO, procesoOrigen: '—', detalleOrigen: '—', horaAccion1: '—', horaAccion2: '—', horaSalidaAula: '—', fechaDia: today },
        { codigoAlumno: 'ALU-301', codigoSede: 'S03', nombreSede: 'S03 - EL AGUSTINO', nombreAlumno: 'Camila Paredes Soto', nivel: 'Primaria', gradoSeccion: '5° Grado A', tutorAula: 'Tutor Aula — S03 - EL AGUSTINO', etapaFlujo: FLOW_STEP.INICIO, procesoOrigen: '—', detalleOrigen: '—', horaAccion1: '—', horaAccion2: '—', horaSalidaAula: '—', fechaDia: today }
      ];

      const tbl_movilidades = [
        {
          idMovilidad: 'MOV-01',
          codigoSede: 'S01',

          nombreMovilidad: 'Movilidad Escolar Azul #01',

          conductor: 'Sr. Martín Rojas',
          capacidadMaxima: 10,
          gradosSecciones: 'Primaria - 3° Grado A | Primaria - 4° Grado B | Inicial - Inicial 5 Años',
          estado: 'ACTIVA'
        }
      ];

      const tbl_movilidad_alumnos = [
        { idMovilidad: 'MOV-01', codigoSede: 'S01', codigoAlumno: 'ALU-101', nombreAlumno: 'Mateo Quispe Ramos', nivel: 'Primaria', gradoSeccion: '3° Grado A' },
        { idMovilidad: 'MOV-01', codigoSede: 'S01', codigoAlumno: 'ALU-103', nombreAlumno: 'Liam Huamán Castro', nivel: 'Primaria', gradoSeccion: '4° Grado B' },
        { idMovilidad: 'MOV-01', codigoSede: 'S01', codigoAlumno: 'ALU-104', nombreAlumno: 'Valeria Salazar Ríos', nivel: 'Inicial', gradoSeccion: 'Inicial 5 Años' }

      return {
        fechaOperativa: today,
        accessProfiles,
        tbl_perfiles_acceso,
        tbl_sedes_niveles,

    function ensureDayRollover(stateObj) {
      const today = getTodayISO();
      if (!stateObj.fechaOperativa) stateObj.fechaOperativa = today;

      if (stateObj.fechaOperativa !== today) {
        stateObj.tbl_alumnos.forEach(a => {
          a.etapaFlujo = FLOW_STEP.INICIO;
          a.procesoOrigen = '—';
          a.detalleOrigen = '—';
          a.horaAccion1 = '—';
          a.horaAccion2 = '—';
          a.horaSalidaAula = '—';
          a.fechaDia = today;
        });
        stateObj.fechaOperativa = today;
        saveState(stateObj);
      }
    }

    function loadState() {
      try {
        const raw = localStorage.getItem(STORAGE_KEY);
        if (!raw) return buildFreshTablesState();
        const parsed = JSON.parse(raw);
        if (!Array.isArray(parsed.tbl_alumnos) || !Array.isArray(parsed.accessProfiles)) {
          return buildFreshTablesState();
        }
        ensureDayRollover(parsed);
        return parsed;
      } catch (e) {
        return buildFreshTablesState();
      }
    }

    function saveState(st = appState) {
      localStorage.setItem(STORAGE_KEY, JSON.stringify(st));
    }

    async function syncTableEvent(action, payload) {
      if (!SHEETS_WEBHOOK_URL) return;
      try {
        await fetch(SHEETS_WEBHOOK_URL, {
          method: 'POST',
          mode: 'no-cors',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ action, ...payload })
        });
      } catch (_) {}
    }

    function recreateAllTablesNow() {
      appState = buildFreshTablesState();
      saveState(appState);
      syncTableEvent('RECREATE_TABLES', { fechaOperativa: appState.fechaOperativa });
      if (currentUser) {
        renderCurrentTab();
      }
      showToast('Tablas creadas nuevamente con los perfiles por sede y grados disponibles.');
    }

    let appState = loadState();
    let currentUser = null;
    let activeTab = '';

    // =========================================================================
    // 3. AUTENTICACIÓN POR SEDE Y PERFIL (TUTOR PUERTA / TUTOR AULA / ADMINISTRADOR)
    // =========================================================================
    document.getElementById('loginForm').addEventListener('submit', e => {
      e.preventDefault();
      const selectedSede = document.getElementById('loginSede').value;
      const u = document.getElementById('loginUser').value.trim().toLowerCase();
      const p = document.getElementById('loginPass').value;
      const errEl = document.getElementById('loginError');

      const acc = appState.accessProfiles.find(a => {
        if (a.estado !== 'ACTIVO') return false;
        if (a.usuario.toLowerCase() !== u || a.clave !== p) return false;
        if (a.perfil === 'ADMINISTRADOR') return selectedSede === 'TODAS' || selectedSede === a.codigoSede;
        return a.codigoSede === selectedSede;
      });

      if (!acc) {
        errEl.textContent = 'Credenciales o sede inválidas para el perfil seleccionado.';
        errEl.classList.remove('hidden');
        return;
      }
      errEl.classList.add('hidden');
      enterApp(acc);
    });

    document.getElementById('recreateTablesBtn').addEventListener('click', recreateAllTablesNow);

    document.getElementById('logoutBtn').addEventListener('click', () => {
      currentUser = null;
      document.getElementById('appShell').classList.add('hidden');
      document.getElementById('loginScreen').classList.remove('hidden');
      document.getElementById('loginPass').value = '';
    });

    function enterApp(acc) {
      currentUser = acc;
      ensureDayRollover(appState);

      document.getElementById('loginScreen').classList.add('hidden');
      document.getElementById('appShell').classList.remove('hidden');

      const roleTitles = {
        TUTOR_PUERTA: 'Tutor Puerta',
        TUTOR_AULA: 'Tutor Aula',
        ADMINISTRADOR: 'Administrador'
      };
      document.getElementById('roleBadge').textContent = roleTitles[acc.perfil] || acc.perfil;
      const sedeText = acc.codigoSede === 'TODAS' ? 'Todas las Sedes' : acc.nombreSede;
      document.getElementById('userContextLabel').textContent = `${acc.nombre} • ${sedeText}`;

      const tabs = getTabsForRole(acc.perfil);
      activeTab = tabs[0].id;
      renderTabs(tabs);
      renderCurrentTab();
    }

    function getTabsForRole(perfil) {
      if (perfil === 'TUTOR_PUERTA') {
        return [
          { id: 'tutorFlow', label: 'Flujo: Proceso A/B → Tutor → Aula' },
          { id: 'tablesView', label: 'Tablas del Proceso' }
        ];
      }
      if (perfil === 'TUTOR_AULA') {
        return [
          { id: 'aulaModule', label: 'Módulo Tutor Aula (Salida → Fin)' },
          { id: 'tablesView', label: 'Tablas del Proceso' }
        ];
      }
      return [
        { id: 'mobilitySetup', label: 'Sedes, Grados y Movilidades' },
        { id: 'tablesView', label: 'Todas las Tablas' }
      ];
    }

    function renderTabs(tabs) {
      const box = document.getElementById('navTabsContainer');
      box.innerHTML = tabs.map(t => `
        <button type="button" data-tab="${t.id}"
          class="px-4 py-3 text-xs font-bold border-b-2 transition whitespace-nowrap ${
            t.id === activeTab
              ? 'border-blue-400 text-white bg-slate-900/50'
              : 'border-transparent text-slate-300 hover:text-white hover:border-slate-500'
          }">${t.label}</button>
      `).join('');

      box.querySelectorAll('[data-tab]').forEach(btn => {
        btn.addEventListener('click', () => {
          activeTab = btn.dataset.tab;
          renderTabs(getTabsForRole(currentUser.perfil));
          renderCurrentTab();
        });
      });
    }

    function renderCurrentTab() {
      ensureDayRollover(appState);
      const container = document.getElementById('mainContent');
      if (activeTab === 'tutorFlow') return renderTutorGateFlow(container);
      if (activeTab === 'aulaModule') return renderTutorAulaModule(container);
      if (activeTab === 'mobilitySetup') return renderMobilityAndGradesSetup(container);
      return renderTablesExplorer(container);
    }

    function getEtapaBadge(etapa) {
      if (etapa === FLOW_STEP.FINALIZADO) {
        return `<span class="px-2 py-0.5 rounded-full text-[10px] font-bold bg-emerald-100 text-emerald-800">FIN DEL FLUJO (SALIDA)</span>`;
      }
      if (etapa === FLOW_STEP.ACCION_2_NOTIFICADO) {
        return `<span class="px-2 py-0.5 rounded-full text-[10px] font-bold bg-blue-100 text-blue-800">NOTIFICADO A MÓDULO AULA</span>`;
      }
      if (etapa === FLOW_STEP.ACCION_1_VERIFICADO) {
        return `<span class="px-2 py-0.5 rounded-full text-[10px] font-bold bg-amber-100 text-amber-800">ACCIÓN 1: VERIFICADO</span>`;
      }
      return `<span class="px-2 py-0.5 rounded-full text-[10px] font-bold bg-slate-100 text-slate-700">INICIO (PROCESO A/B)</span>`;
    }

    // =========================================================================
    // 4. FLUJO PRINCIPAL: PROCESO A / B -> TUTOR O PERSONAL -> 2 ACCIONES -> AULA
    // =========================================================================
    function tutorAccion1Verificar(codigoAlumno, procesoTipo, detalleTexto) {
      const st = appState.tbl_alumnos.find(a => a.codigoAlumno === codigoAlumno && a.codigoSede === currentUser.codigoSede);
      if (!st) return;

      const hora = getNowHHMM();
      st.etapaFlujo = FLOW_STEP.ACCION_1_VERIFICADO;
      st.procesoOrigen = procesoTipo;
      st.detalleOrigen = detalleTexto;
      st.horaAccion1 = hora;

      saveState();
      syncTableEvent('ACCION_1_VERIFICAR', { codigoAlumno, procesoTipo, detalleTexto, hora });
      renderCurrentTab();
      showToast(`Acción 1 completada: ${st.nombreAlumno} (${st.gradoSeccion}).`);
    }

    function tutorAccion2NotificarAula(codigoAlumno) {
      const st = appState.tbl_alumnos.find(a => a.codigoAlumno === codigoAlumno && a.codigoSede === currentUser.codigoSede);
      if (!st) return;

      const hora = getNowHHMM();
      const today = getTodayISO();

      if (st.horaAccion1 === '—') st.horaAccion1 = hora;
      st.etapaFlujo = FLOW_STEP.ACCION_2_NOTIFICADO;
      st.horaAccion2 = hora;

      appState.tbl_notificaciones_aula.unshift({
        idNotificacion: `NOTIF-${Date.now()}-${st.codigoAlumno}`,
        fecha: today,
        horaAccion1: st.horaAccion1,
        horaNotificacionAula: hora,
        codigoSede: st.codigoSede,
        procesoOrigen: st.procesoOrigen || 'PROCESO A (PAPÁ/FAMILIAR)',
        detalleOrigen: st.detalleOrigen || 'Llegada en puerta',
        codigoAlumno: st.codigoAlumno,
        nombreAlumno: st.nombreAlumno,
        nivel: st.nivel,
        gradoSeccion: st.gradoSeccion,
        tutorPuerta: currentUser.nombre,
        tutorAula: st.tutorAula,
        estadoNotificacion: 'ENVIADA_A_MODULO_AULA'
      });

      saveState();
      syncTableEvent('ACCION_2_NOTIFICAR_AULA', { codigoAlumno, horaNotificacionAula: hora, tutorPuerta: currentUser.nombre });
      renderCurrentTab();
      showToast(`Acción 2 enviada al Módulo Tutor Aula: ${st.nombreAlumno}.`);
    }

    function tutorAccion2NotificarMovilidadPorGrados(idMovilidad) {
      const mov = appState.tbl_movilidades.find(m => m.idMovilidad === idMovilidad && m.codigoSede === currentUser.codigoSede);
      if (!mov) return;

      const asignados = appState.tbl_movilidad_alumnos.filter(ma => ma.idMovilidad === idMovilidad);
      if (!asignados.length) {
        showToast('La movilidad no tiene alumnos asignados.');
        return;
      }

      const hora = getNowHHMM();
      const today = getTodayISO();

      asignados.forEach(rel => {
        const st = appState.tbl_alumnos.find(a => a.codigoAlumno === rel.codigoAlumno && a.codigoSede === currentUser.codigoSede);
        if (!st) return;

        st.etapaFlujo = FLOW_STEP.ACCION_2_NOTIFICADO;
        st.procesoOrigen = 'PROCESO B (MOVILIDAD)';
        st.detalleOrigen = `${mov.nombreMovilidad} [${mov.placa}] — Grados/Secciones: ${mov.gradosSecciones}`;
        if (st.horaAccion1 === '—') st.horaAccion1 = hora;
        st.horaAccion2 = hora;

        appState.tbl_notificaciones_aula.unshift({
          idNotificacion: `NOTIF-${Date.now()}-${st.codigoAlumno}`,
          fecha: today,
          horaAccion1: st.horaAccion1,
          horaNotificacionAula: hora,
          codigoSede: st.codigoSede,
          procesoOrigen: 'PROCESO B (MOVILIDAD)',
          detalleOrigen: st.detalleOrigen,
          codigoAlumno: st.codigoAlumno,
          nombreAlumno: st.nombreAlumno,
          nivel: st.nivel,
          gradoSeccion: st.gradoSeccion,
          tutorPuerta: currentUser.nombre,
          tutorAula: st.tutorAula,
          estadoNotificacion: 'ENVIADA_A_MODULO_AULA'
        });
      });

      saveState();
      syncTableEvent('ACCION_2_NOTIFICAR_MOVILIDAD', { idMovilidad, horaNotificacionAula: hora, tutorPuerta: currentUser.nombre });
      renderCurrentTab();
      showToast(`Notificada movilidad "${mov.nombreMovilidad}" (${mov.gradosSecciones}) al Módulo Tutor Aula.`);
    }

        <div class="space-y-6 fade-in">
          <div class="bg-white rounded-2xl border border-slate-200 p-6 shadow-sm">
            <div class="flex flex-wrap items-center justify-between gap-2 mb-3">
              <div>
                <h2 class="text-base font-extrabold text-slate-900">Sedes y Grados Disponibles</h2>
                <p class="text-xs text-slate-500">Niveles y grados/secciones habilitados por sede para asignar alumnos y movilidades.</p>
              </div>
              <button type="button" id="btnRecreateInView" class="px-3.5 py-2 rounded-xl bg-indigo-600 hover:bg-indigo-700 text-white text-xs font-bold shadow">
                Crear Tablas Nuevamente
              </button>
            </div>
            <div class="overflow-x-auto border border-slate-200 rounded-xl">
              <table class="w-full text-left text-xs">
                <thead class="bg-slate-50 text-slate-600 font-bold border-b border-slate-200">
                  <tr>
                    <th class="px-3.5 py-2.5">Sede</th>
                    <th class="px-3.5 py-2.5">Niveles</th>
                    <th class="px-3.5 py-2.5">Grados Disponibles</th>
                  </tr>
                </thead>
                <tbody class="divide-y divide-slate-100">
                  ${SEDES_Y_GRADOS.map(s => `
                    <tr>
                      <td class="px-3.5 py-2.5 font-bold text-slate-900">${s.nombreSede} <span class="text-[10px] text-slate-400">(${s.codigoSede})</span></td>
                      <td class="px-3.5 py-2.5 font-semibold text-blue-800">${s.niveles.join(' y ')}</td>
                      <td class="px-3.5 py-2.5 text-slate-700">${s.grados.join(' • ')}</td>
                    </tr>
                  `).join('')}
                </tbody>
              </table>
            </div>
          </div>

          <div class="grid grid-cols-1 lg:grid-cols-3 gap-6">
            <div class="bg-white rounded-2xl border border-slate-200 p-6 shadow-sm h-fit">
              <h2 class="text-base font-extrabold text-slate-900 mb-1">Registrar Servicio de Movilidad</h2>
              <p class="text-xs text-slate-500 mb-4">Filtra por sede y muestra únicamente los grados disponibles en esa sede.</p>

              <form id="newMovForm" class="space-y-3.5">
                <div>
                  <label class="block text-xs font-bold text-slate-700 mb-1">Sede</label>
                  <select id="newMovSede" class="w-full px-3 py-2 rounded-xl border border-slate-300 text-xs font-semibold">
                    ${SEDES_Y_GRADOS.map(s => `<option value="${s.codigoSede}">${s.nombreSede} (${s.codigoSede})</option>`).join('')}
                  </select>
                </div>
                <div>
                  <label class="block text-xs font-bold text-slate-700 mb-1">Grados Disponibles en la Sede</label>
                  <select id="newMovGradeFilter" class="w-full px-3 py-2 rounded-xl border border-slate-300 text-xs font-semibold"></select>
                </div>
                <div>
                  <label class="block text-xs font-bold text-slate-700 mb-1">Nombre de Movilidad</label>
                  <input id="newMovName" type="text" required placeholder="Ej. Movilidad Escolar Roja #03"
                    class="w-full px-3 py-2 rounded-xl border border-slate-300 text-xs" />
                </div>
                <div class="grid grid-cols-2 gap-3">
                  <div>
                    <label class="block text-xs font-bold text-slate-700 mb-1">Placa</label>
                    <input id="newMovPlate" type="text" required placeholder="XYZ-987"
                      class="w-full px-3 py-2 rounded-xl border border-slate-300 text-xs font-mono" />
                  </div>
                  <div>
                    <label class="block text-xs font-bold text-slate-700 mb-1">Capacidad</label>
                    <input id="newMovCap" type="number" min="1" max="60" value="15" required
                      class="w-full px-3 py-2 rounded-xl border border-slate-300 text-xs font-mono" />
                  </div>
                </div>
                <div>
                  <label class="block text-xs font-bold text-slate-700 mb-1">Alumnos Asignados</label>
                  <div id="newMovChecks" class="max-h-40 overflow-y-auto border border-slate-200 rounded-xl p-2 space-y-1 bg-slate-50"></div>
                </div>
                <button type="submit" class="w-full py-2.5 rounded-xl bg-teal-700 hover:bg-teal-800 text-white text-xs font-bold shadow">
                  Guardar en tbl_movilidades
                </button>
              </form>
            </div>

            <div class="lg:col-span-2 bg-white rounded-2xl border border-slate-200 p-6 shadow-sm">
              <h2 class="text-base font-extrabold text-slate-900 mb-3">Tabla: tbl_movilidades</h2>
              <div class="overflow-x-auto border border-slate-200 rounded-xl">
                <table class="w-full text-left text-xs">
                  <thead class="bg-slate-50 text-slate-600 font-bold border-b border-slate-200">
                    <tr>
                      <th class="px-3 py-2.5">Sede / Movilidad</th>
                      <th class="px-3 py-2.5">Placa</th>
                      <th class="px-3 py-2.5">Alumnos</th>
                      <th class="px-3 py-2.5">Grados y Secciones</th>
                    </tr>
                  </thead>
                  <tbody id="movListBody" class="divide-y divide-slate-100"></tbody>
                </table>
              </div>
            </div>
          </div>
        </div>
      `;

      document.getElementById('btnRecreateInView').addEventListener('click', recreateAllTablesNow);

      const sedeSel = document.getElementById('newMovSede');
      const gradeSel = document.getElementById('newMovGradeFilter');
      sedeSel.value = defaultSede;

      const syncGradeOptionsAndChecks = () => {
        const cfg = getSedeConfig(sedeSel.value);
        const currentGrade = gradeSel.value;
        gradeSel.innerHTML = `<option value="TODOS">Todos los grados de ${cfg.codigoSede}</option>` +
          cfg.grados.map(g => `<option value="${g}">${g}</option>`).join('');
        if (currentGrade && (currentGrade === 'TODOS' || cfg.grados.includes(currentGrade))) {
          gradeSel.value = currentGrade;
        }

        const list = appState.tbl_alumnos.filter(a => {
          if (a.codigoSede !== sedeSel.value) return false;
          if (gradeSel.value && gradeSel.value !== 'TODOS') return a.gradoSeccion === gradeSel.value;
          return true;
        });

        document.getElementById('newMovChecks').innerHTML = list.length ? list.map(a => `
          <label class="flex items-center justify-between text-xs bg-white px-2.5 py-1.5 rounded-lg border border-slate-200 cursor-pointer">
            <span class="flex items-center gap-2">
              <input type="checkbox" name="chkAlumnoMov" value="${a.codigoAlumno}" />
              <strong>${a.nombreAlumno}</strong>
            </span>
            <span class="text-[10px] text-slate-500">${a.nivel} &bull; ${a.gradoSeccion}</span>
          </label>
        `).join('') : `<p class="text-[11px] text-slate-400 p-2">No hay alumnos registrados para este grado en la sede seleccionada.</p>`;
      };

      const renderMovs = () => {
        document.getElementById('movListBody').innerHTML = appState.tbl_movilidades.map(m => {
          const count = appState.tbl_movilidad_alumnos.filter(x => x.idMovilidad === m.idMovilidad).length;
          return `
            <tr>
              <td class="px-3 py-2.5 font-bold text-slate-900">${m.nombreMovilidad} <span class="text-[10px] block text-slate-400">${getSedeConfig(m.codigoSede).nombreSede} (${m.codigoSede})</span></td>
              <td class="px-3 py-2.5 font-mono text-slate-700">${m.placa}</td>
              <td class="px-3 py-2.5 font-bold text-teal-700">${count} / ${m.capacidadMaxima}</td>
              <td class="px-3 py-2.5 text-slate-700">${m.gradosSecciones}</td>
            </tr>
          `;
        }).join('');
      };

      syncGradeOptionsAndChecks();
      renderMovs();
      sedeSel.addEventListener('change', syncGradeOptionsAndChecks);
      gradeSel.addEventListener('change', syncGradeOptionsAndChecks);

      document.getElementById('newMovForm').addEventListener('submit', e => {
        e.preventDefault();
        const code = sedeSel.value;
        const cfg = getSedeConfig(code);
        const cap = Number(document.getElementById('newMovCap').value);
        const selected = Array.from(document.querySelectorAll('input[name="chkAlumnoMov"]:checked')).map(i => i.value);
        if (!selected.length) {
          showToast('Seleccione al menos un alumno.');
          return;
        }
        if (selected.length > cap) {
          showToast(`Supera la capacidad (${cap}).`);
          return;
        }

        const idMov = `MOV-${Date.now()}`;
        const alumnosRel = appState.tbl_alumnos.filter(a => a.codigoSede === code && selected.includes(a.codigoAlumno));
        const gradosSecciones = Array.from(new Set(alumnosRel.map(a => `${a.nivel} - ${a.gradoSeccion}`))).join(' | ');

        const newMov = {
          idMovilidad: idMov,
          codigoSede: code,
          nombreSede: cfg.nombreSede,
          nombreMovilidad: document.getElementById('newMovName').value.trim(),
          placa: document.getElementById('newMovPlate').value.trim().toUpperCase(),
          conductor: 'Asignado',
          capacidadMaxima: cap,
          gradosSecciones,
          estado: 'ACTIVA'
        };

        appState.tbl_movilidades.unshift(newMov);
        alumnosRel.forEach(a => {
          appState.tbl_movilidad_alumnos.push({
            idMovilidad: idMov,
            codigoSede: code,
            codigoAlumno: a.codigoAlumno,
            nombreAlumno: a.nombreAlumno,
            nivel: a.nivel,
            gradoSeccion: a.gradoSeccion
          });
        });

        saveState();
        syncTableEvent('UPSERT_MOVILIDAD', { mobility: newMov });
        document.getElementById('newMovForm').reset();
        sedeSel.value = code;
        syncGradeOptionsAndChecks();
        renderMovs();
        showToast(`Movilidad guardada en ${cfg.nombreSede}.`);
      });
    }

    function renderTablesExplorer(container) {
      const renderTableCard = (tableName, rows) => {
        if (!rows || !rows.length) {
          return `
            <div class="bg-white rounded-2xl border border-slate-200 p-5 shadow-sm">
              <h3 class="text-sm font-extrabold text-slate-900 mb-1">${tableName}</h3>
              <p class="text-xs text-slate-400">Sin registros aún.</p>
            </div>
          `;
        }
        const cols = Object.keys(rows[0]);
        return `
          <div class="bg-white rounded-2xl border border-slate-200 p-5 shadow-sm">
            <div class="flex items-center justify-between mb-3">
              <h3 class="text-sm font-extrabold text-slate-900">${tableName}</h3>
              <span class="px-2 py-0.5 rounded-full text-[10px] font-bold bg-slate-100 text-slate-700">${rows.length} fila(s)</span>
            </div>
            <div class="overflow-x-auto border border-slate-200 rounded-xl">
              <table class="w-full text-left text-xs">
                <thead class="bg-slate-50 text-slate-600 font-bold border-b border-slate-200">
                  <tr>${cols.map(c => `<th class="px-3 py-2 whitespace-nowrap">${c}</th>`).join('')}</tr>
                </thead>
                <tbody class="divide-y divide-slate-100">
                  ${rows.map(r => `
                    <tr>${cols.map(c => `<td class="px-3 py-2 whitespace-nowrap text-slate-700">${r[c] ?? '—'}</td>`).join('')}</tr>
                  `).join('')}
                </tbody>
              </table>
            </div>
          </div>
        `;
      };

      container.innerHTML = `
        <div class="space-y-6 fade-in">
          <div class="flex justify-end">
            <button type="button" id="btnRecreateTablesTop" class="px-3.5 py-2 rounded-xl bg-indigo-600 hover:bg-indigo-700 text-white text-xs font-bold shadow">
              Crear Tablas Nuevamente
            </button>
          </div>
          ${renderTableCard(TABLES.PERFILES_ACCESO, appState.tbl_perfiles_acceso)}
          ${renderTableCard(TABLES.SEDES_NIVELES, appState.tbl_sedes_niveles)}
          ${renderTableCard(TABLES.ALUMNOS, appState.tbl_alumnos)}
          ${renderTableCard(TABLES.MOVILIDADES, appState.tbl_movilidades)}
          ${renderTableCard(TABLES.MOVILIDAD_ALUMNOS, appState.tbl_movilidad_alumnos)}
          ${renderTableCard(TABLES.NOTIFICACIONES_AULA, appState.tbl_notificaciones_aula)}
          ${renderTableCard(TABLES.SALIDAS_ESTUDIANTES, appState.tbl_salidas_estudiantes)}
        </div>
      `;
      document.getElementById('btnRecreateTablesTop').addEventListener('click', recreateAllTablesNow);
    }
  </script>
</body>
</html>
