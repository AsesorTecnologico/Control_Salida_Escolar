<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>AulaSalida Smart — Flujo de Salida Escolar</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <style>
    body { font-family: Inter, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; }
    .fade-in { animation: fadeIn 0.2s ease-in-out; }
    @keyframes fadeIn { from { opacity: 0; transform: translateY(4px); } to { opacity: 1; transform: translateY(0); } }
  </style>
</head>
<body class="bg-slate-100 text-slate-900 min-h-screen">

  <!-- INICIO DE SESIÓN -->
  <div id="loginScreen" class="min-h-screen flex items-center justify-center p-4 bg-gradient-to-br from-slate-900 via-blue-950 to-slate-900">
    <div class="w-full max-w-md bg-white rounded-2xl shadow-2xl border border-slate-200 p-7 fade-in">
      <div class="flex items-center gap-3 mb-6">
        <div class="w-11 h-11 rounded-xl bg-blue-700 text-white flex items-center justify-center font-extrabold text-lg shadow">AS</div>
        <div>
          <h1 class="text-xl font-extrabold text-slate-900 leading-tight">AulaSalida Smart</h1>
          <p class="text-xs text-slate-500">Acceso por Sede y Perfil</p>
        </div>
      </div>

      <form id="loginForm" class="space-y-4">
        <div>
          <label class="block text-xs font-bold text-slate-700 mb-1">Sede</label>
          <select id="loginSede"
            class="w-full px-3.5 py-2.5 rounded-xl border border-slate-300 bg-white text-sm font-semibold focus:outline-none focus:ring-2 focus:ring-blue-600"></select>
        </div>
        <div>
          <label class="block text-xs font-bold text-slate-700 mb-1">Usuario</label>
          <input id="loginUser" type="text" required autocomplete="username"
            class="w-full px-3.5 py-2.5 rounded-xl border border-slate-300 text-sm focus:outline-none focus:ring-2 focus:ring-blue-600" />
        </div>
        <div>
          <label class="block text-xs font-bold text-slate-700 mb-1">Contraseña</label>
          <input id="loginPass" type="password" required autocomplete="current-password"
            class="w-full px-3.5 py-2.5 rounded-xl border border-slate-300 text-sm focus:outline-none focus:ring-2 focus:ring-blue-600" />
        </div>
        <p id="loginError" class="text-xs font-semibold text-rose-600 hidden"></p>
        <button type="submit" class="w-full py-2.5 rounded-xl bg-blue-700 hover:bg-blue-800 text-white font-bold text-sm shadow transition">
          Ingresar al Sistema
        </button>
      </form>
    </div>
  </div>

  <!-- SHELL PRINCIPAL -->
  <div id="appShell" class="hidden min-h-screen flex flex-col">
    <header class="bg-slate-900 text-white border-b border-slate-800 sticky top-0 z-30">
      <div class="max-w-7xl mx-auto px-4 py-3 flex flex-wrap items-center justify-between gap-3">
        <div class="flex items-center gap-3">
          <div class="w-9 h-9 rounded-lg bg-blue-600 flex items-center justify-center font-extrabold text-sm">AS</div>
          <div>
            <div class="flex items-center gap-2">
              <span class="font-extrabold text-sm tracking-tight">AulaSalida Smart</span>
              <span id="roleBadge" class="px-2 py-0.5 rounded-full text-[10px] font-bold bg-blue-500/20 text-blue-200 border border-blue-400/30"></span>
              <span id="fechaOperativaBadge" class="px-2 py-0.5 rounded-full text-[10px] font-mono font-bold bg-slate-800 text-slate-300 border border-slate-700"></span>
            </div>
            <p id="userContextLabel" class="text-[11px] text-slate-300"></p>
          </div>
        </div>

        <div class="flex items-center gap-2">
          <button id="migrarDiaBtn" type="button"
            class="px-3 py-1.5 rounded-lg bg-amber-600 hover:bg-amber-700 text-white text-xs font-bold transition shadow">
            Migrar Alumnos a Nuevo Día
          </button>
          <button id="recreateTablesBtn" type="button"
            class="px-3 py-1.5 rounded-lg bg-indigo-600 hover:bg-indigo-700 text-white text-xs font-bold transition shadow">
            Crear Tablas Nuevamente
          </button>
          <button id="logoutBtn" type="button" class="px-3 py-1.5 rounded-lg bg-rose-600 hover:bg-rose-700 text-white text-xs font-bold transition">
            Cerrar sesión
          </button>
        </div>
      </div>

      <nav id="topNav" class="bg-slate-800/90 border-t border-slate-700/70">
        <div id="navTabsContainer" class="max-w-7xl mx-auto px-4 flex items-center gap-1 overflow-x-auto"></div>
      </nav>
    </header>

    <main id="mainContent" class="flex-1 max-w-7xl w-full mx-auto px-4 py-6"></main>
  </div>

  <div id="toastBox" class="fixed bottom-5 right-5 z-50 hidden max-w-sm px-4 py-3 rounded-xl bg-slate-900 text-white text-xs font-semibold shadow-xl border border-slate-700"></div>

  <script>
    // =========================================================================

      { codigoSede: 'S14', nombreSede: 'S14 - PISCO', sheetTab: 'S14_PISCO', niveles: ['Primaria'], grados: ['1° Grado A', '2° Grado A', '3° Grado A', '4° Grado A', '5° Grado A', '6° Grado A'] },
      { codigoSede: 'S15', nombreSede: 'S15 - PUCALLPA', sheetTab: 'S15_PUCALLPA', niveles: ['Inicial', 'Primaria'], grados: ['Inicial 4 Años', 'Inicial 5 Años', '1° Grado A', '2° Grado A', '3° Grado A', '4° Grado A', '5° Grado A'] },
      { codigoSede: 'S16', nombreSede: 'S16 - PUENTE PIEDRA', sheetTab: 'S16_PUENTEPIEDRA', niveles: ['Inicial', 'Primaria'], grados: ['Inicial 3 Años', 'Inicial 4 Años', 'Inicial 5 Años', '1° Grado A', '2° Grado A', '3° Grado A', '4° Grado B', '5° Grado A', '6° Grado A'] },
      { codigoSede: 'S17', nombreSede: 'S17 - QUILCA', sheetTab: 'S17_QUILCA', niveles: ['Primaria'], grados: ['1° Grado A', '2° Grado A', '3° Grado A', '4° Grado A', '5° Grado A', '6° Grado A'] },

      { codigoSede: 'S20', nombreSede: 'S20 - SANTA ANITA', sheetTab: 'S20_SANTAANITA', niveles: ['Primaria'], grados: ['1° Grado A', '2° Grado A', '3° Grado A', '4° Grado A', '5° Grado A', '6° Grado A'] },
      { codigoSede: 'S21', nombreSede: 'S21 - SORIA', sheetTab: 'S21_SORIA', niveles: ['Inicial', 'Primaria'], grados: ['Inicial 4 Años', 'Inicial 5 Años', '1° Grado A', '2° Grado A', '3° Grado A', '4° Grado A', '5° Grado A'] },

    ];

    const SEDE_MAP = Object.fromEntries(SEDES_Y_GRADOS.map(s => [s.codigoSede, s]));

    function getSedeConfig(code) {
      return SEDE_MAP[code] || SEDES_Y_GRADOS[0];
    }

    function buildAccessProfilesForSedes() {
      const profiles = [
        {
          codigoPerfil: 'PERF-ADMIN',
          usuario: 'admin.general',
          clave: 'Admin2026!',
          perfil: 'ADMINISTRADOR',
          nombre: 'Administrador General del Sistema',
          codigoSede: 'TODAS',
          nombreSede: 'Todas las Sedes',
          estado: 'ACTIVO'
        }
      ];

      SEDES_Y_GRADOS.forEach(s => {
        const slug = s.codigoSede.toLowerCase();
        profiles.push({
          codigoPerfil: `PERF-${s.codigoSede}-PUERTA`,
          usuario: `puerta.${slug}`,
          clave: `Puerta${s.codigoSede}!`,
          perfil: 'TUTOR_PUERTA',
          nombre: `Tutor Puerta — ${s.nombreSede}`,
          codigoSede: s.codigoSede,
          nombreSede: s.nombreSede,
          estado: 'ACTIVO'
        });
        profiles.push({
          codigoPerfil: `PERF-${s.codigoSede}-AULA`,
          usuario: `aula.${slug}`,
          clave: `Aula${s.codigoSede}!`,
          perfil: 'TUTOR_AULA',
          nombre: `Tutor Aula — ${s.nombreSede}`,
          codigoSede: s.codigoSede,
          nombreSede: s.nombreSede,
          estado: 'ACTIVO'
        });
      });

      return profiles;
    }

    (function populateLoginSedeSelect() {
      const sel = document.getElementById('loginSede');
      sel.innerHTML =
        `<option value="TODAS">Todas las Sedes (Perfil Administrador)</option>` +
        SEDES_Y_GRADOS.map(s => `<option value="${s.codigoSede}">${s.nombreSede}</option>`).join('');
    })();

    function getTodayISO() {
      const now = new Date();
      const y = now.getFullYear();
      const m = String(now.getMonth() + 1).padStart(2, '0');
      const d = String(now.getDate()).padStart(2, '0');
      return `${y}-${m}-${d}`;
    }

    function getNextDayISO(isoDate) {
      const base = isoDate ? new Date(`${isoDate}T12:00:00`) : new Date();
      base.setDate(base.getDate() + 1);
      const y = base.getFullYear();
      const m = String(base.getMonth() + 1).padStart(2, '0');
      const d = String(base.getDate()).padStart(2, '0');
      return `${y}-${m}-${d}`;
    }

    function getNowHHMM() {
      return new Date().toLocaleTimeString('es-PE', { hour: '2-digit', minute: '2-digit', hour12: false });
    }

    function showToast(msg) {
      const box = document.getElementById('toastBox');
      box.textContent = msg;
      box.classList.remove('hidden');
      clearTimeout(window.__toastTimer);
      window.__toastTimer = setTimeout(() => box.classList.add('hidden'), 3600);
    }

    // =========================================================================
    // 2. REGISTROS DIARIOS Y MIGRACIÓN DE ALUMNOS AL DÍA SIGUIENTE
    // =========================================================================
    function buildFreshTablesState() {
      const today = getTodayISO();
      const accessProfiles = buildAccessProfilesForSedes();

      const tbl_perfiles_acceso = accessProfiles.map(p => ({
        codigoPerfil: p.codigoPerfil,
        usuario: p.usuario,
        perfil: p.perfil,
        nombre: p.nombre,
        codigoSede: p.codigoSede,
        nombreSede: p.nombreSede,
        estado: p.estado
      }));

      const tbl_sedes_niveles = SEDES_Y_GRADOS.map(s => ({
        codigoSede: s.codigoSede,
        nombreSede: s.nombreSede,
        hojaSede: s.sheetTab,
        nivelesDisponibles: s.niveles.join(' y '),
        gradosDisponibles: s.grados.join(' | ')
      }));

      const tbl_alumnos = [
        { codigoAlumno: 'ALU-101', codigoSede: 'S01', nombreSede: 'S01 - CAJAMARCA', nombreAlumno: 'Mateo Quispe Ramos', grado: '3° Grado A', aula: 'Aula 101', etapaFlujo: FLOW_STEP.PENDIENTE, horaNotifAula: '—', horaConfirmAula: '—', horaFinProceso: '—', fechaDia: today },
        { codigoAlumno: 'ALU-102', codigoSede: 'S01', nombreSede: 'S01 - CAJAMARCA', nombreAlumno: 'Sofía Mendoza Díaz', grado: '3° Grado A', aula: 'Aula 101', etapaFlujo: FLOW_STEP.PENDIENTE, horaNotifAula: '—', horaConfirmAula: '—', horaFinProceso: '—', fechaDia: today },
        { codigoAlumno: 'ALU-103', codigoSede: 'S01', nombreSede: 'S01 - CAJAMARCA', nombreAlumno: 'Liam Huamán Castro', grado: '4° Grado B', aula: 'Aula 104', etapaFlujo: FLOW_STEP.PENDIENTE, horaNotifAula: '—', horaConfirmAula: '—', horaFinProceso: '—', fechaDia: today },
        { codigoAlumno: 'ALU-104', codigoSede: 'S01', nombreSede: 'S01 - CAJAMARCA', nombreAlumno: 'Valeria Salazar Ríos', grado: 'Inicial 5 Años', aula: 'Aula I-02', etapaFlujo: FLOW_STEP.PENDIENTE, horaNotifAula: '—', horaConfirmAula: '—', horaFinProceso: '—', fechaDia: today },
        { codigoAlumno: 'ALU-201', codigoSede: 'S02', nombreSede: 'S02 - CAMPOY', nombreAlumno: 'Gabriel Herrera Luna', grado: '2° Grado A', aula: 'Aula 202', etapaFlujo: FLOW_STEP.PENDIENTE, horaNotifAula: '—', horaConfirmAula: '—', horaFinProceso: '—', fechaDia: today },
        { codigoAlumno: 'ALU-301', codigoSede: 'S03', nombreSede: 'S03 - EL AGUSTINO', nombreAlumno: 'Camila Paredes Soto', grado: '5° Grado A', aula: 'Aula 305', etapaFlujo: FLOW_STEP.PENDIENTE, horaNotifAula: '—', horaConfirmAula: '—', horaFinProceso: '—', fechaDia: today }
      ];

      return {
        fechaOperativa: today,
        accessProfiles,
        tbl_perfiles_acceso,
        tbl_sedes_niveles,
        tbl_alumnos,
        tbl_notificaciones_aula: [],
        tbl_salidas_estudiantes: []
      };
    }

    // Migra los alumnos cargados conservando nombreAlumno, grado y aula,
    // reiniciando el flujo diario y limpiando los registros del día anterior
    function migrarListaAlumnosParaSiguienteDia(stateObj, nuevaFecha) {
      const targetDate = nuevaFecha || getNextDayISO(stateObj.fechaOperativa);
      stateObj.tbl_alumnos = stateObj.tbl_alumnos.map(a => ({
        codigoAlumno: a.codigoAlumno,
        codigoSede: a.codigoSede,
        nombreSede: a.nombreSede,
        nombreAlumno: a.nombreAlumno,
        grado: a.grado,
        aula: a.aula,
        etapaFlujo: FLOW_STEP.PENDIENTE,
        horaNotifAula: '—',
        horaConfirmAula: '—',
        horaFinProceso: '—',
        fechaDia: targetDate
      }));
      // Los registros de notificaciones y salidas son diarios: se limpian al iniciar el nuevo día
      stateObj.tbl_notificaciones_aula = [];
      stateObj.tbl_salidas_estudiantes = [];
      stateObj.fechaOperativa = targetDate;
    }

    function ensureDayRollover(stateObj) {
      const today = getTodayISO();
      if (!stateObj.fechaOperativa) {
        stateObj.fechaOperativa = today;
        return;
      }
      if (stateObj.fechaOperativa !== today && stateObj.fechaOperativa < today) {
        migrarListaAlumnosParaSiguienteDia(stateObj, today);
        saveState(stateObj);
      }
    }

    function loadState() {
      try {
        const raw = localStorage.getItem(STORAGE_KEY);
        if (!raw) return buildFreshTablesState();
        const parsed = JSON.parse(raw);
        if (!Array.isArray(parsed.tbl_alumnos) || !Array.isArray(parsed.accessProfiles)) {
          return buildFreshTablesState();
        }
        ensureDayRollover(parsed);
        return parsed;
      } catch (e) {
        return buildFreshTablesState();
      }
    }

    function saveState(st = appState) {
      localStorage.setItem(STORAGE_KEY, JSON.stringify(st));
    }

    async function syncTableEvent(action, payload) {
      if (!SHEETS_WEBHOOK_URL) return;
      try {
        await fetch(SHEETS_WEBHOOK_URL, {
          method: 'POST',
          mode: 'no-cors',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ action, ...payload })
        });
      } catch (_) {}
    }

    function migrarAlumnosSiguienteDiaManual() {
      const siguienteFecha = getNextDayISO(appState.fechaOperativa);
      migrarListaAlumnosParaSiguienteDia(appState, siguienteFecha);
      saveState(appState);
      updateHeaderDateBadge();
      syncTableEvent('MIGRAR_ALUMNOS_DIA', { nuevaFecha: siguienteFecha });
      if (currentUser) renderCurrentTab();
      showToast(`Lista de alumnos migrada para el día ${siguienteFecha} (registros diarios reiniciados).`);
    }

    function recreateAllTablesNow() {
      appState = buildFreshTablesState();
      saveState(appState);
      updateHeaderDateBadge();
      syncTableEvent('RECREATE_TABLES', { fechaOperativa: appState.fechaOperativa });
      if (currentUser) renderCurrentTab();
      showToast('Tablas creadas nuevamente para el registro diario.');
    }

    function updateHeaderDateBadge() {
      const el = document.getElementById('fechaOperativaBadge');
      if (el) el.textContent = `Día: ${appState.fechaOperativa}`;
    }

    let appState = loadState();
    let currentUser = null;
    let activeTab = '';
    let selectedSedeForAdmin = SEDES_Y_GRADOS[0].codigoSede;

    function getActiveSedeCode() {
      if (!currentUser) return SEDES_Y_GRADOS[0].codigoSede;
      return currentUser.perfil === 'ADMINISTRADOR' ? selectedSedeForAdmin : currentUser.codigoSede;
    }

    // =========================================================================
    // 3. AUTENTICACIÓN POR SEDE Y PERFIL
    // =========================================================================
    document.getElementById('loginForm').addEventListener('submit', e => {
      e.preventDefault();
      const selectedSede = document.getElementById('loginSede').value;
      const u = document.getElementById('loginUser').value.trim().toLowerCase();
      const p = document.getElementById('loginPass').value;
      const errEl = document.getElementById('loginError');

      const acc = appState.accessProfiles.find(a => {
        if (a.estado !== 'ACTIVO') return false;
        if (a.usuario.toLowerCase() !== u || a.clave !== p) return false;
        if (a.perfil === 'ADMINISTRADOR') return selectedSede === 'TODAS' || selectedSede === a.codigoSede;
        return a.codigoSede === selectedSede;
      });

      if (!acc) {
        errEl.textContent = 'Credenciales o sede inválidas para el perfil seleccionado.';
        errEl.classList.remove('hidden');
        return;
      }
      errEl.classList.add('hidden');
      enterApp(acc);
    });

    document.getElementById('migrarDiaBtn').addEventListener('click', migrarAlumnosSiguienteDiaManual);
    document.getElementById('recreateTablesBtn').addEventListener('click', recreateAllTablesNow);

    document.getElementById('logoutBtn').addEventListener('click', () => {
      currentUser = null;
      document.getElementById('appShell').classList.add('hidden');
      document.getElementById('loginScreen').classList.remove('hidden');
      document.getElementById('loginPass').value = '';
    });

    function enterApp(acc) {
      currentUser = acc;
      ensureDayRollover(appState);
      updateHeaderDateBadge();

      document.getElementById('loginScreen').classList.add('hidden');
      document.getElementById('appShell').classList.remove('hidden');

      const roleTitles = {
        TUTOR_PUERTA: 'Tutor Puerta',
        TUTOR_AULA: 'Tutor Aula',
        ADMINISTRADOR: 'Administrador'
      };
      document.getElementById('roleBadge').textContent = roleTitles[acc.perfil] || acc.perfil;
      const sedeText = acc.codigoSede === 'TODAS' ? 'Todas las Sedes' : acc.nombreSede;
      document.getElementById('userContextLabel').textContent = `${acc.nombre} • ${sedeText}`;

      const tabs = getTabsForRole(acc.perfil);
      activeTab = tabs[0].id;
      renderTabs(tabs);
      renderCurrentTab();
    }

    function getTabsForRole(perfil) {
      if (perfil === 'TUTOR_PUERTA') {
        return [
          { id: 'tutorFlow', label: 'Flujo Puerta y Procesos (Sede)' },
          { id: 'cargaAlumnos', label: 'Carga de Alumnos (Sede)' }
        ];
      }
      if (perfil === 'TUTOR_AULA') {
        return [
          { id: 'aulaModule', label: 'Módulo Aula y Procesos (Sede)' },
          { id: 'cargaAlumnos', label: 'Carga de Alumnos (Sede)' }
        ];
      }
      return [
        { id: 'cargaAlumnos', label: 'Carga de Alumnos (Por Sede)' },
        { id: 'processBySede', label: 'Tabla de Procesos (Por Sede)' }
      ];
    }

    function renderTabs(tabs) {
      const box = document.getElementById('navTabsContainer');
      box.innerHTML = tabs.map(t => `
        <button type="button" data-tab="${t.id}"
          class="px-4 py-3 text-xs font-bold border-b-2 transition whitespace-nowrap ${
            t.id === activeTab
              ? 'border-blue-400 text-white bg-slate-900/50'
              : 'border-transparent text-slate-300 hover:text-white hover:border-slate-500'
          }">${t.label}</button>
      `).join('');

      box.querySelectorAll('[data-tab]').forEach(btn => {
        btn.addEventListener('click', () => {
          activeTab = btn.dataset.tab;
          renderTabs(getTabsForRole(currentUser.perfil));
          renderCurrentTab();
        });
      });
    }

    function renderCurrentTab() {
      ensureDayRollover(appState);
      updateHeaderDateBadge();
      const container = document.getElementById('mainContent');
      if (activeTab === 'cargaAlumnos') return renderCargaAlumnosPorSede(container);
      if (activeTab === 'processBySede') return renderTablaProcesosPorSede(container);
      if (activeTab === 'tutorFlow') return renderTutorGateFlow(container);
      return renderTutorAulaModule(container);
    }

    // 5. FLUJO: TUTOR PUERTA NOTIFICA A AULA -> TUTOR AULA CONFIRMA -> TERMINA
    // =========================================================================
    function getEtapaBadge(etapa) {
      if (etapa === FLOW_STEP.FINALIZADO) {
        return `<span class="px-2 py-0.5 rounded-full text-[10px] font-bold bg-emerald-100 text-emerald-800">PROCESO TERMINADO</span>`;
      }
      if (etapa === FLOW_STEP.CONFIRMADO_AULA) {
        return `<span class="px-2 py-0.5 rounded-full text-[10px] font-bold bg-indigo-100 text-indigo-800">CONFIRMADO POR AULA (A PUERTA)</span>`;
      }
      if (etapa === FLOW_STEP.NOTIFICADO_AULA) {
        return `<span class="px-2 py-0.5 rounded-full text-[10px] font-bold bg-blue-100 text-blue-800">NOTIFICADO A TUTOR DE AULA</span>`;
      }
      return `<span class="px-2 py-0.5 rounded-full text-[10px] font-bold bg-slate-100 text-slate-700">PENDIENTE EN PUERTA</span>`;
    }

    // Paso 1: Tutor de la puerta notifica al tutor del aula
    function tutorPuertaNotificarAula(codigoAlumno) {
      const st = appState.tbl_alumnos.find(a => a.codigoAlumno === codigoAlumno && a.codigoSede === currentUser.codigoSede);
      if (!st) return;

      const hora = getNowHHMM();
      st.etapaFlujo = FLOW_STEP.NOTIFICADO_AULA;
      st.horaNotifAula = hora;
      st.fechaDia = appState.fechaOperativa;

      appState.tbl_notificaciones_aula.unshift({
        fecha: appState.fechaOperativa,
        horaNotificacion: hora,
        codigoSede: st.codigoSede,
        nombreAlumno: st.nombreAlumno,
        grado: st.grado,
        aula: st.aula,
        tutorPuerta: currentUser.nombre,
        estado: 'NOTIFICADO_A_AULA'
      });

      saveState();
      syncTableEvent('NOTIFICAR_TUTOR_AULA', { codigoAlumno, horaNotifAula: hora, fecha: appState.fechaOperativa });
      renderCurrentTab();
      showToast(`Tutor de puerta notificó al tutor de aula: ${st.nombreAlumno} (${st.aula}).`);
    }

    // Paso 2: Tutor de aula confirma que el alumno se dirige a la puerta
    function tutorAulaConfirmarAlumnoAPuerta(codigoAlumno) {
      const st = appState.tbl_alumnos.find(a => a.codigoAlumno === codigoAlumno && a.codigoSede === currentUser.codigoSede);
      if (!st) return;

      const hora = getNowHHMM();
      st.etapaFlujo = FLOW_STEP.CONFIRMADO_AULA;
      st.horaConfirmAula = hora;

      saveState();
      syncTableEvent('CONFIRMAR_ALUMNO_A_PUERTA', { codigoAlumno, horaConfirmAula: hora, fecha: appState.fechaOperativa });
      renderCurrentTab();
      showToast(`Tutor de aula confirmó que ${st.nombreAlumno} se dirige a la puerta.`);
    }

    // Paso 3: Termina el proceso (entrega en puerta / cierre del registro diario)
    function terminarProcesoSalida(codigoAlumno) {
      const st = appState.tbl_alumnos.find(a => a.codigoAlumno === codigoAlumno && a.codigoSede === currentUser.codigoSede);
      if (!st) return;

      const hora = getNowHHMM();
      st.etapaFlujo = FLOW_STEP.FINALIZADO;
      st.horaFinProceso = hora;

      appState.tbl_salidas_estudiantes.unshift({
        fecha: appState.fechaOperativa,
        horaFinProceso: hora,
        codigoSede: st.codigoSede,
        nombreAlumno: st.nombreAlumno,
        grado: st.grado,
        aula: st.aula,
        horaNotifAula: st.horaNotifAula,
        horaConfirmAula: st.horaConfirmAula,
        estado: 'PROCESO_TERMINADO'
      });

      saveState();
      syncTableEvent('TERMINAR_PROCESO', { codigoAlumno, horaFinProceso: hora, fecha: appState.fechaOperativa });
      renderCurrentTab();
      showToast(`Proceso terminado para ${st.nombreAlumno}.`);
    }

              <span class="px-2.5 py-1 rounded-full text-xs font-bold bg-indigo-50 text-indigo-800">${procesosSede.length} alumno(s)</span>
            </div>

            <div class="overflow-x-auto border border-slate-200 rounded-xl">
              <table class="w-full text-left text-xs">
                <thead class="bg-slate-50 text-slate-600 font-bold border-b border-slate-200">
                  <tr>
                    <th class="px-3 py-2.5">Nombre Alumno</th>
                    <th class="px-3 py-2.5">Grado</th>
                    <th class="px-3 py-2.5">Aula</th>
                    <th class="px-3 py-2.5">Estado del Proceso</th>
                    <th class="px-3 py-2.5">Hora Notif. Aula</th>
                    <th class="px-3 py-2.5">Hora Conf. Aula</th>
                    <th class="px-3 py-2.5">Hora Fin</th>
                  </tr>
                </thead>
                <tbody class="divide-y divide-slate-100">
                  ${procesosSede.length ? procesosSede.map(p => `
                    <tr>
                      <td class="px-3 py-2.5 font-bold text-slate-900">${p.nombreAlumno}</td>
                      <td class="px-3 py-2.5 text-slate-700">${p.grado}</td>
                      <td class="px-3 py-2.5 font-semibold text-blue-800">${p.aula}</td>
                      <td class="px-3 py-2.5">${getEtapaBadge(p.etapaFlujo)}</td>
                      <td class="px-3 py-2.5 font-mono text-slate-600">${p.horaNotifAula}</td>
                      <td class="px-3 py-2.5 font-mono text-slate-600">${p.horaConfirmAula}</td>
                      <td class="px-3 py-2.5 font-mono text-slate-600">${p.horaFinProceso}</td>
                    </tr>
                  `).join('') : `
                    <tr>
                      <td colspan="7" class="px-4 py-8 text-center text-slate-400">No hay registros para esta sede.</td>
                    </tr>
                  `}
                </tbody>
              </table>
            </div>
          </div>
        </div>
      `;

      bindAdminSedeSelector(container);
    }
  </script>
</body>
</html>
